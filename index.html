<style>
/* ===================== 设计系统 v2 =====================
   一套主色 + 三个语义色 + 暖灰系。色相只在表达含义时出现。 */
:root{
  /* 底与面 */
  --bg:#f7f4ef; --bg2:#efeae3; --surface:#ffffff; --surface2:#fbf9f6; --surface3:#f4f1ec;
  /* 墨 */
  --ink:#2a2f2e; --ink2:#535a59; --muted:#8a908e;
  /* 线 */
  --line:#e5dfd6; --line2:#d5ccc0;
  /* 主色：松绿 */
  --p:#6e8b7b; --p-deep:#4e6a5b; --p-soft:#e8efeb; --p-ink:#3a5445;
  /* 语义：正确 / 警示 / 错误 / 信息 */
  --ok:#5c8a6a; --ok-soft:#e6f0e9; --ok-ink:#3c6647;
  --warn:#bf8a3c; --warn-soft:#f8efdd; --warn-ink:#7d5a22;
  --bad:#b5705f; --bad-soft:#f7e8e3; --bad-ink:#7d4a3c;
  --info:#6b8899; --info-soft:#e8eef2; --info-ink:#3f5a68;
  /* 影 */
  --sh1:0 1px 2px rgba(42,47,46,.04);
  --sh2:0 1px 2px rgba(42,47,46,.04), 0 10px 28px -14px rgba(42,47,46,.16);
  --r:14px; --r-sm:10px; --r-lg:18px;
  --t:160ms cubic-bezier(.4,0,.2,1);
}
body.dark{
  --bg:#22211e; --bg2:#1c1b19; --surface:#2b2a26; --surface2:#302f2b; --surface3:#35332e;
  --ink:#eae6df; --ink2:#c3bfb7; --muted:#9a968e;
  --line:#3b3934; --line2:#4a4741;
  --p:#8aa899; --p-deep:#a7c2b3; --p-soft:#2c3831; --p-ink:#c6dccf;
  --ok:#8fb79b; --ok-soft:#28332c; --ok-ink:#bcd9c5;
  --warn:#d8ab63; --warn-soft:#383022; --warn-ink:#e8cfa0;
  --bad:#cf9384; --bad-soft:#3a2b27; --bad-ink:#e8c0b5;
  --info:#93aebd; --info-soft:#26313a; --info-ink:#c3d6e0;
  --sh1:0 1px 2px rgba(0,0,0,.24);
  --sh2:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif;
  font-size:15px;line-height:1.78;letter-spacing:.012em;-webkit-font-smoothing:antialiased;
  transition:background var(--t),color var(--t)}
a{color:var(--p-deep);text-decoration:none;border-bottom:1px solid transparent;transition:var(--t)}
a:hover{border-bottom-color:currentColor}
::selection{background:var(--p-soft)}
:focus-visible{outline:2px solid var(--p);outline-offset:2px;border-radius:6px}

.wrap{display:flex;min-height:100vh}

/* ---------- 侧栏 ---------- */
.side{width:268px;flex:0 0 268px;background:var(--bg2);border-right:1px solid var(--line);
  padding:20px 16px 40px;position:sticky;top:0;height:100vh;overflow-y:auto;
  scrollbar-width:thin}
.side::-webkit-scrollbar{width:8px}
.side::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 6px}
.brand .mark{width:36px;height:36px;border-radius:11px;flex:0 0 36px;
  background:linear-gradient(145deg,var(--p),var(--p-deep));color:#fff;
  display:grid;place-items:center;font-size:19px;font-weight:600;
  box-shadow:0 6px 14px -8px rgba(78,106,91,.9)}
.brand b{font-size:15.5px;letter-spacing:-.01em;display:block;line-height:1.3}
.brand small{display:block;color:var(--muted);font-size:11.5px;line-height:1.45;font-weight:400}
.sect{margin:20px 0 8px;font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:600}
.goal{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--surface);border:1px solid transparent;border-radius:var(--r-sm);
  padding:10px 12px;margin-bottom:6px;cursor:pointer;color:var(--ink);
  font-size:14px;font-family:inherit;line-height:1.45;transition:var(--t);position:relative}
.goal:hover{background:var(--surface3);transform:translateX(2px)}
.goal.on{background:var(--p-soft);color:var(--p-ink);font-weight:600;
  box-shadow:var(--sh1)}
.goal.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;
  border-radius:99px;background:var(--p)}
.goal .ico{font-size:17px;line-height:1;flex:0 0 20px;text-align:center;filter:saturate(.85)}
.goal small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:1px}
.goal.on small{color:var(--p-ink);opacity:.75}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.bar>i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--p),var(--info));transition:width .4s cubic-bezier(.4,0,.2,1)}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);line-height:1.9}
.kv b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:7px 12px;cursor:pointer;font-family:inherit;font-size:13px;color:var(--ink2);
  line-height:1.5;transition:var(--t)}
.btn:hover{border-color:var(--line2);background:var(--surface2);color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff;font-weight:500}
.btn.pri:hover{background:var(--p-deep);border-color:var(--p-deep);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface3);color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;padding:32px 40px 96px;max-width:1100px}
.main>h1:first-child{margin-top:4px}
h1{font-size:26px;line-height:1.35;margin:6px 0 6px;letter-spacing:-.015em;font-weight:650}
h2{font-size:18px;line-height:1.45;margin:34px 0 12px;letter-spacing:-.008em;
  padding-bottom:8px;border-bottom:1px solid var(--line);font-weight:600}
h3{font-size:15.5px;margin:22px 0 8px;color:var(--ink2);font-weight:600}
.lead{color:var(--ink2);margin:0 0 4px;font-size:14.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 18px;margin:12px 0;box-shadow:var(--sh1);transition:var(--t)}
.card:hover{box-shadow:var(--sh2)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;line-height:1.6;
  padding:2px 9px;border-radius:99px;background:var(--surface3);color:var(--ink2);
  font-weight:500;white-space:nowrap}
.chip.b{background:var(--info-soft);color:var(--info-ink)}
.chip.m{background:var(--p-soft);color:var(--p-ink)}
.chip.r{background:var(--warn-soft);color:var(--warn-ink)}
.chip.g{background:var(--ok-soft);color:var(--ok-ink)}
.chip.d{background:var(--bad-soft);color:var(--bad-ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.num{font-weight:600;color:var(--ink)}
th{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.06em;
  background:transparent;position:sticky;top:0}
tbody tr{transition:background var(--t)}
tbody tr:hover td{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
td b{font-weight:600}

/* 题目 */
.qwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin:12px 0;box-shadow:var(--sh1);transition:var(--t)}
.qwrap:hover{box-shadow:var(--sh2)}
.qstem{font-size:15.5px;line-height:2.05;margin:10px 0 4px;color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}
.opt{border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;cursor:pointer;
  background:var(--surface2);font-size:14.5px;display:flex;gap:10px;align-items:flex-start;
  line-height:1.9;transition:var(--t)}
.opt:hover{border-color:var(--line2);background:var(--surface);transform:translateX(2px)}
.opt>b{color:var(--muted);font-weight:600;flex:0 0 16px}
.opt.sel{border-color:var(--info);background:var(--info-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right>b{color:var(--ok-ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong>b{color:var(--bad-ink)}
.tin{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface2);font-family:inherit;font-size:14.5px;color:var(--ink);transition:var(--t)}
.tin:focus{outline:none;border-color:var(--p);background:var(--surface);
  box-shadow:0 0 0 3px var(--p-soft)}
.ans{margin-top:14px;padding:13px 16px;border-left:3px solid var(--ok);
  background:var(--ok-soft);border-radius:0 var(--r-sm) var(--r-sm) 0;color:var(--ok-ink)}
.ans.mid{border-left:3px solid var(--warn,#bf8a3c);background:var(--warn-soft,#f7f1e6)}
.ans.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink)}
.ans b{color:inherit}
.src{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.7}
.katex{font-size:1.04em}

/* 知识树 */
.treegrp{border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden;
  background:var(--surface);box-shadow:var(--sh1)}
.treegrp>summary{padding:13px 16px;cursor:pointer;font-weight:600;font-size:14.5px;
  list-style:none;transition:var(--t)}
.treegrp>summary:hover{background:var(--surface2)}
.treegrp>summary::-webkit-details-marker{display:none}
.treegrp>summary::after{content:"›";float:right;color:var(--muted);transition:var(--t);
  font-size:18px;line-height:1}
.treegrp[open]>summary::after{transform:rotate(90deg)}
.treegrp[open]>summary{border-bottom:1px solid var(--line);background:var(--surface2)}
.trow{display:flex;align-items:center;gap:10px;padding:11px 16px;
  border-bottom:1px solid var(--line);font-size:14px;transition:var(--t);
  flex-wrap:wrap}                      /* 允许换行：窄屏下 pill/按钮掉到第二行，不挤名字 */
.trow > span:not(.dot):not(.pill){min-width:0;flex:1 1 140px}   /* 名字列优先占满，不再被压成竖排 */
.trow .pill{white-space:nowrap}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--surface2)}
.dot{width:8px;height:8px;border-radius:99px;background:var(--line2);flex:0 0 8px}
.dot.l0{background:var(--line2)} .dot.l1{background:var(--warn)}
.dot.l2{background:var(--info)} .dot.l3{background:var(--p)}
.pill{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.freq{display:inline-block;height:5px;border-radius:99px;
  background:linear-gradient(90deg,var(--p),var(--info));vertical-align:middle;min-width:3px}
.empty{color:var(--muted);font-size:13.5px;padding:18px 0;text-align:center}
.timer{font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* 首页目标卡 */
.gcard{display:flex;align-items:center;gap:13px;cursor:pointer;padding:15px 17px;margin:12px 0}
.gcard:hover{border-color:var(--line2);transform:translateY(-2px)}
.gcard .gi{font-size:22px;line-height:1;flex:0 0 30px;text-align:center;filter:saturate(.85)}
.gcard b{font-size:15px;font-weight:600}
.gcard small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

/* 视图切换的柔和入场 */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#view>*{animation:fadeUp .28s cubic-bezier(.4,0,.2,1) both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:640px){
  /* 手机端"按知识点学"的行：名字必须占满一行，否则会出现"一列一个字"的竖排 */
  .trow{gap:8px;padding:12px 13px}
  .trow > span:not(.dot):not(.pill){flex:1 1 100%;order:1;font-size:15px;line-height:1.5}
  .trow .pill{order:2;font-size:12px}
  .trow .chip{order:2}
  .trow .btn{order:3;flex:1 1 auto;min-height:34px}
  .trow .dot{order:0}
  .trow input[type=checkbox]{order:0;width:18px!important;height:18px!important}
}
@media(max-width:900px){
  .wrap{flex-direction:column}
  /* 侧栏压成"顶部一行入口条"：手机上原来它占满整屏，内容要滑很久才看见。
     入口横滑、次要信息（进度/数据）收起，正文立刻可见。 */
  .side{width:100%;flex:none;height:auto;position:sticky;top:0;z-index:20;
        padding:9px 12px 7px;border-right:0;border-bottom:1px solid var(--line);box-shadow:var(--sh1);
        background:var(--bg2)}
  .brand{margin-bottom:5px}
  .brand .mark{width:30px;height:30px;flex:0 0 30px;font-size:16px;border-radius:9px}
  .brand b{font-size:14px} .brand small{font-size:10.5px}
  #goals{display:flex;gap:6px;overflow-x:auto;padding:2px 0 3px;scrollbar-width:none;
         position:relative;mask-image:linear-gradient(90deg,#000 88%,transparent)}
  #goals .goal{min-width:104px}
  #goals::-webkit-scrollbar{display:none}
  #goals .goal{flex:0 0 auto;margin:0;padding:7px 11px;font-size:13px;border:1px solid var(--line)}
  #goals .goal small{display:none}
  #goals .goal .ico{font-size:15px}
  .side .sect, .side .bar, .side .kv{display:none}          /* 进度/数据先收起，正文优先 */
  .side > div:last-child{margin-top:6px!important}
  .side > div:last-child .btn{padding:4px 9px;font-size:12px}
  .main{padding:16px 14px 76px;max-width:none}
  h1{font-size:21px;margin-top:2px}
  h2{font-size:16.5px;margin-top:24px}
  .two{grid-template-columns:1fr}
  .card{padding:13px 14px}
  table{font-size:12.5px}
  th,td{padding:9px 6px}
  .yr{display:none}                                          /* 年份列在窄屏缩掉，免得挤压换行 */
  td:last-child,th:last-child{white-space:nowrap}
  table td:has(.dot){white-space:nowrap}
  .qstem{font-size:15px;line-height:1.95}
  .chip{font-size:11px;padding:2px 7px}
  .btn{padding:6px 10px}
}
.rel{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.relstem{font-size:13.5px;line-height:1.75;margin-top:5px}
.btn.xs{padding:3px 9px;font-size:12px}

/* 键盘可达性：焦点要看得见（纯键盘用户才知道现在选到哪） */
.goal:focus-visible,.gcard:focus-visible,.btn:focus-visible,.trow:focus-visible{
  outline:2px solid var(--sage,#6e8b7b);outline-offset:2px;border-radius:10px}
.gcard{cursor:pointer}

/* 手机上长公式会超出屏宽（实测超出 111px）——单独给公式横向滚动，
   不要用 overflow:hidden 裁掉（学生就没法看全了） */
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
#view .katex{font-size:1.02em}
@media(max-width:640px){
  .katex-display{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .card{padding:13px 13px}          /* 手机上卡片内边距收一点，正文更宽 */
}
</style>
</head>

</div>

<script>/* 数据见 data/payload.js（线上拆包，便于单独缓存）*/</script>
<script>
/* ===== 状态 ===== */
const D = window.__DATA__;
const T = {}; D.topics.forEach(t => T[t.id] = t);
const LS_KEY = 'gaoshu_target_lab_v1';
const BOOK = '上册';   // 本学期范围（海大 高数 I-1）
/* 知识点 → 交互演示（真实可拖动的图，不是静态插图） */
/* 一个知识点可挂多个演示：[文件名, 一句话说明]。9 个新演示由子代理产出，
   数学与渲染我已独立复核（重算了全部数值 + 逐格截图看渲染）。 */
const DEMOS = {
  K02: [['demo_seq_limit_en.html', '拖 ε 看最小 N：数列从第几项起全部落进 ε 带'],
        ['demo_monotone_bounded.html', '拖初值看数列：单调 + 有界 ⇒ 收敛到不动点']],
  K03: [['demo_func_limit_ed.html', '拖 ε 看 δ：函数极限的 ε-δ 夹逼']],
  K04: [['demo_equiv_inf.html', '拖 x 看比值：sin x/x、tan x/x 怎么趋近 1']],
  K06: [['demo_equiv_inf.html', '拖 x 看比值：等价无穷小替换到底怎么来的']],
  K07: [['demo_continuity.html', '切四种间断点：连续的三条件到底差哪一条']],
  K09: [['demo_derivative_def.html', '拖 h 看割线变切线：差商趋近导数']],
  K12: [['demo_derivative_def.html', '拖 h 看割线变切线（微分的直观来源）']],
  K13: [['demo_mvt.html', '拖切点看切线平行于弦：中值定理的几何意义']],
  K14: [['demo_lhopital.html', '拖 x 看 f/g 与 f′/g′ 同时趋近同一极限']],
  K15: [['demo_taylor.html', '拖阶数看多项式逼近：泰勒展开为什么能逼近']],
  K16: [['demo_extrema.html', '拖点看 f′ 的符号：增减性与极值判定']],
  K17: [['demo_concavity.html', '拖点看切线与曲线：凹凸性与拐点']],
  K19: [['demo_substitution.html', '拖分界看 x 与 t 两根轴上的区间怎么对应']],
  K20: [['demo_parts.html', '看 u、dv、uv、∫v du 四项怎么对上：分部积分']],
  K22: [['demo_riemann.html', '拖 n 看阶梯逼近面积：定积分的定义']],
  K23: [['demo_ftc.html', '拖上限看面积累积：F(x)=∫f 与 F′=f 的关系']],

/* 掌握度：0 未学 / 1 学过 / 2 会做 / 3 熟练（按正确率自动升档） */
function mlevel(id){ const m=S.mastery[id]; if(!m) return 0;
  const n=(m.right||0)+(m.wrong||0); if(!n) return 1;
  const acc=m.right/n; if(n>=3&&acc>=0.85) return 3; if(acc>=0.6) return 2; return 1; }
function markAnswer(q, ok){

/* ===== 公式渲染（离线 KaTeX） ===== */
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function tex(s){ try{ return katex.renderToString(s,{throwOnError:false,displayMode:false}); }
  catch(e){ return esc(s); } }
function rich(s){   // $...$ 与 $$...$$ → KaTeX；markdown 粗体 → <b>；其余按纯文本
  if(s==null) return '';
  /* ⚠️⚠️ 只还原"后面不是字母"的字面 \n（负向前瞻）。
     原来写的是无脑 replace(/\\n/g,'\n') —— 但 LaTeX 里 **\neq（≠）\nabla \notin \nmid
     全都以 \n 开头** ✗ → 会被切成「真换行 + eq」→ 页面显示成
     "F'(x)  换行  eq 0" 这种残片，学生看到的就是"代码"（用户实测反馈的元凶）。
     正确判据：\n 后跟空格/数字/中文/标点 才是被双重转义的换行。 */
  s = String(s).replace(/\\n(?![A-Za-z])/g, '\n');
  /* 视觉模型转录讲义时，把 LaTeX 命令写成了**双反斜杠**（`\\lim`、`\\{x_n\\}`）——
     实测 topic_sources 里这种有 3 万多处 ✗。KaTeX 把 `\\` 当**换行**，于是公式会
     在中间断行、花括号还会漏出来 ✗。只收敛"后面跟字母"的那些；
     矩阵/cases 里的换行是 `\\` 后面跟空白或 `&`，必须原样保留。 */
  s = s.replace(/\\+(?=[A-Za-z])/g, '\\');
  // 模型常把美元符转义成 \$（还有 \( \) \[ \] 这些定界符）→ 先还原，否则整段公式原样印出来
  s = String(s).replace(/\\\$/g,'$').replace(/\\\(/g,'$').replace(/\\\)/g,'$')
                  .replace(/\\\[/g,'$$').replace(/\\\]/g,'$$');
  // ② **双反斜杠的 LaTeX 命令**（\\dfrac / \\text / \\to）——渲染不出、原样印成代码。
  //    只折叠"反斜杠+反斜杠+字母"（\begin{cases} 里真正的换行符是 \\ 后跟空白/&，不受影响）
  s = s.replace(/\\\\+([A-Za-z])/g, '\\$1');
  let out='', i=0; const re=/\$\$([^$]+)\$\$|\$([^$]+)\$/g; let m;
  while((m=re.exec(s))){
    out+=mdBold(esc(s.slice(i,m.index)));
    const body=m[1]!=null?m[1]:m[2];
    out += m[1]!=null ? '<div style="text-align:center;margin:8px 0">'+tex(body)+'</div>' : tex(body);
    i=m.index+m[0].length;
  }
  return out+mdBold(esc(s.slice(i)));
}
/* markdown 粗体 → <b>（模型写 **通项** 这类，原样印出来就是"代码感"的元凶之一） */
function mdBold(h){
  return String(h).replace(/\*\*([^*\n]{1,60})\*\*/g, '<b>$1</b>');
}



/* ===================== 视频片段播放器 =====================
   用户想法："视频码能不能换成视频切分呢，视频就在网页里" ——
   不真切片（会再复制 6.6GB），而是喂原视频 + 精确定位到 [t0,t1]，
   到 t1 自动暂停：观感就是切好的片段，零额外磁盘。
   目录自适应：file:// 用绝对 file URL；本地服务模式用相对路径（见 启动学习台.bat）。 */
const VID = window.__VIDEOS__ || {sections: [], dir: ''};
/* 视频基址。默认相对路径（本地 / Netlify 同源都适用）。
   ★ 站点换域名时（如网页迁 GitHub Pages、视频留在 Netlify），构建时注入
     `window.__VIDBASE__ = 'https://<原站>/'` —— 这样**不必重传 2 GB 视频**，
     而且播放器不用改一行。<video> 跨域播放不需要 CORS ✓。 */
function vidBase(){
  if(window.__VIDBASE__) return window.__VIDBASE__;
  const d = (VID.dir || '').replace(/\\/g,'/');
  return location.protocol === 'file:' ? ('file:///' + d + '/') : ('../' + d + '/');
}
/* 切片地址：clip 存的是相对路径（videos/x.mp4）→ 换域名时要补上原站前缀 */
function clipURL(s){
  if(!s || !s.clip) return s ? (vidBase() + encodeURIComponent(s.video)) : '';
  return (window.__VIDBASE__ || '') + s.clip;
}
function fmtT(s){ if(s==null) return ''; const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);
  return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'); }
function playSection(cid, sec){
  const s = VID.sections.find(x=>x.cid===cid && String(x.sec)===String(sec));
  if(!s) return;
  const v = document.getElementById('vplayer');
  const box = document.getElementById('vbox');
  box.style.display='block';
  document.getElementById('vtitle').textContent = `第 ${s.lec} 讲 · ${s.title}`;
  document.getElementById('vrange').textContent = `${fmtT(s.t0)} – ${fmtT(s.t1)}（${Math.round((s.t1-s.t0)/60)} 分钟）`;
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
  // 先把播放器藏起来，探测完再决定显示什么 —— 线上版没有切片文件，
  // 直接赋值 src 只会得到一个坏播放器（用户会以为页面坏了）。
  v.style.display='none';
  let note = document.getElementById('vnonote');
  if(!note){
    note = document.createElement('div');
    note.id = 'vnonote';
    note.style.cssText = 'font-size:13px;line-height:1.9;color:var(--muted);padding:12px 14px;' +
      'background:var(--surface2);border:1px solid var(--line);border-radius:10px';
    box.appendChild(note);
  }
  note.style.display='none';
  /* ★ 不再用 fetch(HEAD) 做"在不在"探测：网页一旦迁到别的域名，视频就是**跨域**的，
     fetch 会被 CORS 拦 ✗ —— 明明能播却判成"不可用"（视频全被判死，最惨的一类假故障）。
     改成直接把 src 交给 <video>，由它自己的 onerror 决定降级：跨域 <video> 播放不需要 CORS ✓。 */
  const src = clipURL(s);
  note.style.display='none';
  v.style.display='block';
  v.onerror = function(){
    v.style.display='none';
    note.innerHTML = '这一段（第 ' + s.lec + ' 讲）的视频暂时取不到 —— 可能是网络或视频源还没就绪。'
      + '<br>其余内容（<b>知识卡 / 讲义原文 / 教材对照 / 交互演示 / 真题</b>）不受影响；'
      + '急看视频可用<b>本地版</b>学习台。';
    note.style.display='block';
  };
  if(s.clip){ v.src = src; v._t0 = 0; v._t1 = (s.t1 - s.t0); }
  else { v.src = src; v._t0 = s.t0; v._t1 = s.t1; }
  v.play().catch(()=>{});
}
function initPlayer(){
  const v = document.getElementById('vplayer');
  if(!v || v._bound) return;
  v._bound = true;
  v.addEventListener('timeupdate', ()=>{
    if(v._t1 && v.currentTime >= v._t1){ v.pause(); }
  });
  v.addEventListener('loadedmetadata', ()=>{ if(v._t0) v.currentTime = v._t0; });
}

/* 线上版没有那 6.3 GB 视频切片（Netlify/GitHub 传不上去），
   所以点播放时先探一下文件在不在：不在就把播放器换成一句说明，
   而不是让用户对着一个坏掉的 <video> 发呆。本地版探测必然成功 → 行为不变。 */
let VPROBE = {};
function videoOK(url, cb){
  if(!url){ cb(false); return; }
  if(url in VPROBE){ cb(VPROBE[url]); return; }
  fetch(url, {method:'HEAD'}).then(r=>{ VPROBE[url] = r.ok; cb(r.ok); })
    .catch(()=>{ VPROBE[url] = false; cb(false); });
}

/* ---- 讲义正文的轻量渲染（标题/列表/表格/公式），够用且不引依赖 ---- */
function mdBlock(text){
  const out = []; let tbl = [];
  const flushTbl = () => {
    if(!tbl.length) return;
    const rows = tbl.filter(r=>!/^\s*\|?[\s:\-|]+\|?\s*$/.test(r)).map(r=>r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|'));
    if(rows.length){
      out.push('<div style="overflow-x:auto"><table style="margin:8px 0">' +
        rows.map((c,i)=>'<tr>'+c.map(x=>`<${i?'td':'th'}>${rich(x.trim())}</${i?'td':'th'}>`).join('')+'</tr>').join('') +
        '</table></div>');
    }
    tbl = [];
  };
  for(const raw of String(text||'').split('\n')){
    const l = raw.replace(/\s+$/,'');
    if(/^\s*\|.*\|\s*$/.test(l)){ tbl.push(l); continue; }
    flushTbl();
    if(!l.trim()){ continue; }
    if(/^#{1,6}\s/.test(l)){ out.push(`<div style="font-weight:600;margin:14px 0 4px;color:var(--ink)">${rich(l.replace(/^#+\s*/,''))}</div>`); continue; }
    if(/^\s*[-*•]\s+/.test(l)){ out.push(`<div style="padding-left:14px;position:relative"><span style="position:absolute;left:2px;color:var(--muted)">•</span>${rich(l.replace(/^\s*[-*•]\s+/,''))}</div>`); continue; }
    if(/^\s*\d+[.、)]\s+/.test(l)){ out.push(`<div style="padding-left:6px">${rich(l)}</div>`); continue; }
    out.push(`<div style="margin:6px 0">${rich(l)}</div>`);
  }
  flushTbl();
  return out.join('');
}

/* 复核状态徽章：official/dual/proof 都是"可信"，conflict 才标红，pending 是琥珀 */
function VCHIP(q){
  const b = (q.verified||{}).by || (q.answer?'official':'pending');
  /* 可信度分级很重要：官方答案 > 双路一致 > 老师原解 > 仲裁定案 > 存疑。
     仲裁是"第三方裁判"，比存疑强、但不能当成官方答案。 */
  /* resolved = 人工/独立验算定案（比双路投票更硬：实测 13 道冲突里 9 道是"两路都错"）*/
  const map = {official:['g','官方答案'], dual:['g','双路一致 ✓'], proof:['b','双路已证'],
               resolved:['g','独立验算'], teacher:['m','老师讲的'], arbitrated:['b','仲裁定案'],
               near:['r','两路表述不同'], conflict:['d','⚠ 两路不一致'], pending:['r','待复核']};
  const [cls,txt] = map[b] || map.pending;
  return `<span class="chip ${cls}" title="答案来源">${txt}</span>`;
}

/* 举一反三：三层，全部**优先用真实材料**（用户要求：宋浩/老师例题能用就用，真题最重要）

   ③ AI 生成变式 —— 仅作补充，明确标注 */
function VARIANTS(q){
  const r = (D.related||{})[q.id] || {};
  /* ⚠️ 必须把"学生刚做的这道题自己"剔除掉。
     找茬智能体实测：做完一道题，下面的「③ AI 生成变式」里印的就是**同一道题**

  const blk = (title, hint, color, body) => body ? `

  const examBody = exams.map(x=>`
    <div class="rel">

        ${x.pts?`<span class="chip m">${x.pts} 分</span>`:''}

      <div class="relstem">${rich(x.stem)}</div>
    </div>`).join('');

  const lecBody = lec.map(x=>`
    <div class="rel">
      <div style="display:flex;gap:6px;align-items:baseline;flex-wrap:wrap">
        <span class="chip m">${esc(String((x.source&&x.source.file)||(x.source||'')).slice(0,22)||'例题')}</span>
        ${(x.methods||[]).length>1?`<span class="chip g">含 ${x.methods.length} 种解法</span>`:''}
        <button class="btn xs" onclick="goQ('${x.id}')">看这道题</button>
      </div>
      <div class="relstem">${rich(x.stem)}</div>
    </div>`).join('');

  const aiBody = ai.map(v=>`
    <div class="rel"><div class="relstem">${rich(v.stem||v.q||v)}</div></div>`).join('');

  return `<div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)">
    <b style="font-size:13.5px">举一反三</b>
    ${blk('① 同类真题', '与其同一考点、不同年份（考试就考这些）', 'var(--ok-ink)', examBody)}
    ${blk('② 宋浩 · 老师例题', '真实例题，含老师讲的解法', 'var(--warn-ink)', lecBody)}
    ${blk('③ AI 生成变式', '前两层不够时补充，非真题', 'var(--muted)', aiBody)}
  </div>`;
}

/* ---- 分享：复制当前页链接（用户要把站发给同学用）---- */
function copyLink(btn){
  const url = location.href;
  const done = () => toast('链接已复制，发给同学就能直接打开这一页');
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, () => fallback());
    } else fallback();
  }catch(e){ fallback(); }
  function fallback(){                       // 老浏览器/非 https 时的兜底
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ prompt('手动复制这个链接：', url); }
    ta.remove();
  }
}
let _toastT = null;
function toast(msg){
  let el = document.getElementById('_toast');
  if(!el){
    el = document.createElement('div'); el.id='_toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);' +
      'background:#22211e;color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;' +
      'z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s';
    document.body.appendChild(el);
  }
  el.textContent = msg; el.style.opacity = '1';
  clearTimeout(_toastT); _toastT = setTimeout(()=>{ el.style.opacity='0'; }, 2200);
}

function statsFor(ids){

    const qs=QS().filter(q=>q.topic===id);
    const pts=qs.reduce((a,q)=>a+(typeof q.points==='number'?q.points:0),0);
    const yrs=[...new Set(qs.map(q=>q.source.year).filter(Boolean))];
    return {id, name:(T[id]||{}).name||id, n:qs.length, pts, yrs, lv:mlevel(id)};

function filterTopics(kw){

function submitPaper(){
  const miss=RUN.list.filter(q=>RUN.ans[q.id]==null||RUN.ans[q.id]==='').length;
  if(miss && !confirm(`还有 ${miss} 题没作答，确定交卷？`)) return;
  let got=0, full=0, right=0;
  RUN.list.forEach(q=>{

    if(q.options&&q.options.length){ const ai=answerIndex(q); ok=(ai!=null&&RUN.ans[q.id]===ai); }
    else { const key=(q.answer||'').replace(/\s/g,'');
           ok=!!key && String(RUN.ans[q.id]||'').replace(/\s/g,'')===key; }
    q._ok=ok;
    if(ok){ got+=p; right++; }

  });

/* ============ 答案等价判定（前端版） ============
   用户实测最要命的问题：原来 `val.replace(/\s/g,'')===q.answer.replace(...)` ——
   纯字符串严格比较 ✗。学生写 `1/3`、标准答案是 `$\dfrac{1}{3}$` → 判"✗ 没对"，
   而且**还被收进错题本** ✗ —— 做对了却被判错，等于把练习废掉了。
   算法直接移植自流水线里的 answer-equivalence（那边用 21 条真值表校准过）：
   常量→分数→根号 按固定顺序转成可求值式，再比字符串 + 数值容差。 */
function normAns(s){
  s = String(s==null?'':s);
  s = s.replace(/\\pi/g,'pi').replace(/\\infty/g,'inf')
       .replace(/\\ln/g,'ln').replace(/\\log/g,'log');
  s = s.replace(/\\sqrt\s*\{([^{}]*)\}/g, function(m,a){ return 'sqrt('+a+')'; });      // 根号必须先于分数
  s = s.replace(/\\[dt]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,
                function(m,a,b){ return '(('+a+')/('+b+'))'; });
  s = s.replace(/\\left|\\right/g,'');
  s = s.replace(/\\[,;!]|\\cdot|\\times/g,'');
  s = s.replace(/\\[a-zA-Z]+/g,'');
  s = s.replace(/[\s$\\{}()\[\]]/g,'');
  s = s.replace(/[\uff0d\u2212]/g,'-').replace(/\uff0c/g,',').replace(/\u3002/g,'')
       .replace(/\u03c0/g,'pi').replace(/\uff0b/g,'+').replace(/\uff1d/g,'=').replace(/\u3000/g,'');
  return s.toLowerCase();
}
function ansNum(s){
  var t = normAns(s);
  if(!t) return null;
  t = t.replace(/sqrt([0-9]+(?:\.[0-9]+)?)/g, '__sq($1)');
  t = t.replace(/pi/g,'__pi').replace(/\^/g,'**');
  t = t.replace(/(^|[^a-z_])e(?![a-z_0-9])/g, '$1__e');
  t = t.replace(/([0-9])__/g,'$1*__').replace(/([0-9])\(/g,'$1*(').replace(/\)([0-9])/g,')*$1');
  if(!/^[0-9+\-*/()._a-z]*$/.test(t)) return null;      // 集合式校验，不用正则字符类
  try{
    var v = Function('__sq','__pi','__e','return ('+t+')')(Math.sqrt, Math.PI, Math.E);
    return (typeof v==='number' && isFinite(v)) ? v : null;
  }catch(e){ return null; }
}
function sameAns(a,b){
  var na=normAns(a), nb=normAns(b);
  if(na && na===nb) return true;
  var xa=ansNum(a), xb=ansNum(b);
  if(xa!==null && xb!==null) return Math.abs(xa-xb) <= 1e-6*Math.max(1,Math.abs(xa),Math.abs(xb));
  return false;
}
function submitFill(id){
  const q=D.questions.find(x=>x.id===id), val=(document.getElementById('in'+id).value||'').trim();
  if(!val){ alert('先写点什么'); return; }
  /* 三态，而不是"对/错"两态：
     · 判等成立 → 做对了 ✓
     · 两边都能算数且不等 → 明确判错（学生要的就是这个反馈）
     · **我们判不准**（答案是文字表述、或表达式我们解析不了）→ 绝不说"错" ✗，
       改成中性提示"我判不准，请对照答案自己核对"，**也不进错题本**。
     ——"不确定就别说学生错"是这一块最重要的设计决定。 */
  if(sameAns(val, q.answer)){
    showFB(q, true, ''); markAnswer(q, true); return;
  }
  const comparable = ansNum(val)!==null && ansNum(q.answer)!==null;
  if(comparable){
    showFB(q, false, '（和你算的不一样，再对一遍）'); markAnswer(q, false); return;
  }
  showFB(q, null, '（这道题答案是文字表述，我判不准 —— 请对照下面的答案自己核对；对错由你判断，不计入错题本）');
  markAnswer(q, null);
}
function answerIndex(q){   // 从答案里认出 A/B/C/D
  const m=/^\s*[（(]?\s*([A-D])\s*[）)]?\s*$/.exec(q.answer||''); return m?m[1].charCodeAt(0)-65:null; }

/* 真题模拟 */
/* 注意：不能把局部变量 groups 写进 onclick —— 点击时作用域里没有它，会静默 ReferenceError。
   所以建表时把卷子存进全局 PAPERS，按钮只传索引。 */
const PAPERS=[], PAPER_NAMES=[];
function startPaperIdx(i){ startPaper(PAPERS[i], PAPER_NAMES[i]); }
function examHTML(){
  const groups={};
  /* 模拟考只收"真题卷"，且必须有可辨年份 ——
     否则讲义例题（无年份）会被拼成一个 237 题的假"卷子"，年份不明的碎片也会混进来。 */
  QS().filter(q=>(q.kind||'真题')==='真题').forEach(q=>{
    const y=String(q.source.year||'').trim();
    if(!/^20\d\d$/.test(y)) return;
    const k=`${y} ${String(q.source.term||'').replace('未知','').trim()} ${String(q.source.exam||'').replace('未知','').trim()}`.trim();
    (groups[k]=groups[k]||[]).push(q);
  });
  const keys=Object.keys(groups).filter(k=>groups[k].length>=2).sort().reverse();
  PAPERS.length=0; PAPER_NAMES.length=0;
  keys.forEach(k=>{ PAPERS.push(groups[k]); PAPER_NAMES.push(k); });
  /* 用户实测提问：「卷子里面题目为什么那么少？每份卷子的分数不是都一样吗？」
     —— 真卷都是 10~12 大题 / 100 分。我们少是因为**源卷是"试题+答案"混排**，
     有些页只有答案、题干没抽到（被"答案碎片"过滤器正确丢掉），所以收录不全。
     这里如实标注"已收录 N 题 / M 分"并给出原卷满分对照，别让学生误以为卷子是完整的。
     同时给一条正路：想练全套就用「期中/期末复习 + 按知识点学」，那里是 1600 道全库。 */
  const FULL_PTS = 100;
  return `<h1>真题模拟</h1>
  <p class="lead">整卷计时作答，交卷后自动算分、错题自动进错题本（交卷前不显示答案）。</p>
  <div class="card" style="background:var(--warn-soft,#f7f1e6);border-color:#e8dcc4;font-size:13px;line-height:1.9">
    <b>关于"题数/总分为什么不满"</b>：真卷是 10~12 大题、<b>满分 100 分</b>；
    下面是题库里<b>已收录并能核对答案</b>的题（源卷是"试题+答案"混排，部分页只有答案、题干缺），
    所以显示为"已收录 N 题 · M 分"。
    想练全套就回 <b>「期中复习 / 按知识点学」</b> —— 那里是 1600+ 道全库，按知识点覆盖更全。
  </div>
  <table><thead><tr><th>卷子</th><th class="num">已收录</th><th class="num">分值</th><th class="num">已做</th><th></th></tr></thead><tbody>
  ${keys.map(k=>{ const qs=groups[k], pts=qs.reduce((a,q)=>a+(Number(q.points)||0),0);
    const dn=qs.filter(q=>S.done[q.id]).length;
    const thin = qs.length < 8;
    return `<tr><td>${k}${thin?' <span class="chip" style="background:var(--warn-soft,#f7f1e6)">收录较少</span>':''}</td>
      <td class="num">${qs.length} 题</td>
      <td class="num">${pts}${pts>0&&pts<FULL_PTS?`<span style="color:var(--muted);font-size:11.5px"> / ${FULL_PTS}</span>`:''}</td>
      <td class="num">${dn}/${qs.length}</td>
      <td><button class="btn sm pri" onclick="startPaperIdx(${keys.indexOf(k)})">⏱ 开始模拟</button></td></tr>`;
  }).join('')}</tbody></table>`;
}
function exportRec(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='高数学习记录.json'; a.click();
}
/* 深链接：index.html#mid 直接进期中复习（方便分享与书签） */
let HASH = (location.hash || '').replace('#', '');
if (typeof HASH_ALIAS === 'object' && HASH in HASH_ALIAS) HASH = HASH_ALIAS[HASH];
if (GOALS.some(g => g.k === HASH)) S.goal = HASH;
else if (HASH === '') S.goal = S.goal || '';
/* 深链接 #learn:K02 直接打开某知识点的学习页（含知识卡/讲义原文/视频片段/演示/真题） */
const MLEARN = /^learn:(K\d+)$/.exec(HASH);
if (MLEARN) S.learnTarget = MLEARN[1];
document.body.classList.toggle('dark',!!S.dark);
renderSide();
if (S.learnTarget && D.topics.some(x=>x.id===S.learnTarget)) { go; learn(S.learnTarget); delete S.learnTarget; }
else render();
addEventListener('hashchange', () => {            // 浏览器返回/前进键要能用
  let h=(location.hash||'').replace('#','');
  if (HASH_ALIAS[h] !== undefined) h = HASH_ALIAS[h];
  const ml = /^learn:(K\d+)$/.exec(h);
  if (ml) { learn(ml[1]); return; }
  if (h === S.goal) return;                       // 自己 pushState 造成的不重复渲染
  if (GOALS.some(g=>g.k===h)) { S.goal=h; save(); window.scrollTo(0,0); render(); }
});

/* ===== 巡检钩子（供 qa_check.py / 自动化检查使用）=====
   const/let 声明的顶层变量不会挂到 window 上，外部脚本（如同源 iframe）拿不到，
   所以这里显式暴露一个只读入口。不影响任何正常功能。 */
window.__APP__ = {
  get S(){ return S; }, get D(){ return D; }, get T(){ return T; },
  get DEMOS(){ return DEMOS; }, get VID(){ return VID; },
  go: go, render: render, learn: learn, QS: QS, statsFor: statsFor
};
</script>
