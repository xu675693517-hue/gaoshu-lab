<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>凹凸性与拐点 · 切线在曲线的哪一侧</title>
<link rel="stylesheet" href="../assets/katex/katex.min.css">
<script src="../assets/katex/katex.min.js"></script>
<style>
:root{
  --bg:#f7f4ef; --surface:#ffffff; --ink:#2a2f2e; --ink2:#535a59;
  --muted:#8a908e; --line:#e5dfd6; --p:#6e8b7b; --p-deep:#4e6a5b;
  --p-soft:#e8efeb; --ok:#5c8a6a; --warn:#bf8a3c; --bad:#b5705f; --info:#6b8899;
}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:10px 14px 9px;box-shadow:0 1px 3px rgba(42,47,46,.05)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.2px}
h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font-family:inherit;font-size:12.5px;color:var(--ink);background:#f1eee8;
  border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer}
button:hover{background:#eae5dc}
.strip{min-height:26px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin:5px 0 4px;font-size:13.5px}
.strip .lbl{font-size:11.5px;color:var(--muted);white-space:nowrap}
.strip .fb{font-family:Consolas,monospace;font-size:12.5px}
.pill{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 8px;
  border:1px solid var(--line);background:#f6f3ee;color:var(--ink2)}
.pill.ao{border-color:#cbdccf;background:var(--p-soft);color:var(--ok)}
.pill.tu{border-color:#cfdae1;background:#eef3f6;color:var(--info)}
.pill.gd{border-color:#dfd3bd;background:#f7f1e6;color:var(--warn)}
#plot{display:block;width:100%;height:auto;background:#fffdfa;border:1px solid var(--line);
  border-radius:10px;touch-action:none;cursor:ew-resize}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:4px 0 0}
.legend i{display:inline-block;width:15px;height:0;border-top-width:2.5px;border-top-style:solid;
  vertical-align:middle;margin-right:3px}
.legend b{font-weight:600}
.sw{display:inline-block;width:14px;height:9px;border-radius:2px;vertical-align:-1px;
  margin-right:3px;border:1px solid #d9d2c6}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:5px 0 3px}
.ctrl label{font-size:12px;color:var(--muted);white-space:nowrap}
input[type=range]{flex:1 1 auto;min-width:120px;height:20px;accent-color:var(--p-deep);
  background:transparent;cursor:pointer}
.val{font-family:Consolas,"Courier New",monospace;font-size:12.5px;color:var(--p-deep);
  min-width:62px;text-align:right;font-variant-numeric:tabular-nums}
.read{display:flex;gap:9px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 4px;
  align-items:center}
.read b{font-family:Consolas,"Courier New",monospace;color:var(--ink);font-weight:600;
  font-variant-numeric:tabular-nums}
.concl{border-left:3px solid var(--p-deep);background:#eaece7;border-radius:0 8px 8px 0;
  padding:7px 11px;font-size:12.8px;line-height:1.5}
.concl b{font-family:Consolas,"Courier New",monospace;color:var(--p-deep);font-weight:600}
.concl .k{color:var(--p-deep);font-weight:600}
svg text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="head">
    <h1>凹凸性与拐点<small id="sub">拖点看切线落在曲线的哪一侧 —— 由 f″(x₀) 的符号决定</small></h1>
    <div class="btns">
      <button id="bGo">跳到拐点 x=0</button>
      <button id="bA">左边（凸 f″&lt;0）</button>
      <button id="bB">右边（凹 f″&gt;0）</button>
    </div>
  </div>

  <div class="strip">
    <span class="lbl">函数与两阶导数</span>
    <span id="tF"></span>
    <span id="tD"></span>
    <span id="tD2"></span>
  </div>

  <svg id="plot" viewBox="0 0 860 196" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="凹凸性与拐点交互示意图">
    <defs><clipPath id="clip"><rect id="clipR" x="44" y="12" width="798" height="138"></rect></clipPath></defs>
    <g id="gGrid"></g>
    <g id="gAxes"></g>
    <g id="gBand"></g>
    <g clip-path="url(#clip)">
      <g id="gShade"></g>
      <path id="pCurveL" fill="none" stroke="#6b8899" stroke-width="3" stroke-linejoin="round"></path>
      <path id="pCurveR" fill="none" stroke="#5c8a6a" stroke-width="3" stroke-linejoin="round"></path>
      <path id="pTanFix" fill="none" stroke="#cfc7bb" stroke-width="1.4" stroke-dasharray="6 5"></path>
      <path id="pTan" fill="none" stroke="#b5705f" stroke-width="2.2" stroke-dasharray="8 4"></path>
      <line id="lDrop" stroke="#8a908e" stroke-width="1.2" stroke-dasharray="3 3"></line>
      <g id="gProbe"></g>
      <circle id="cInfl" cx="0" cy="0" r="4.8" fill="#fffdfa" stroke="#bf8a3c" stroke-width="2.2"></circle>
      <circle id="cPt" cx="0" cy="0" r="6" fill="#b5705f" stroke="#fffdfa" stroke-width="2"></circle>
    </g>
    <g id="gLabels"></g>
  </svg>

  <div class="legend">
    <span><i style="border-top-color:#6b8899"></i><b style="color:#6b8899">凸</b> f″&lt;0 段</span>
    <span><i style="border-top-color:#5c8a6a"></i><b style="color:#5c8a6a">凹</b> f″&gt;0 段</span>
    <span><b style="color:#bf8a3c">○</b> 拐点 (0, 0)</span>
    <span><i style="border-top-color:#b5705f;border-top-style:dashed"></i>x₀ 处的切线</span>
    <span><i style="border-top-color:#cfc7bb;border-top-style:dashed"></i>拐点处切线 y=−3x</span>
    <span><span class="sw" style="background:#dce9e0"></span>曲线在切线上方（凹区间内）</span>
    <span><span class="sw" style="background:#e7eef2"></span>切线在曲线上方（凸区间内）</span>
  </div>

  <div class="ctrl">
    <label for="sx">拖动切点 x₀ =</label>
    <input id="sx" type="range" min="-1.9" max="1.9" step="0.001" value="1.2">
    <span class="val" id="vx">1.200</span>
    <span id="pillS" class="pill ao">凹</span>
  </div>

  <div class="read">
    <span>f(x₀) = <b id="rF">—</b></span>
    <span>f′(x₀) = <b id="rD">—</b></span>
    <span>f″(x₀) = <b id="rD2">—</b></span>
    <span id="pillP" class="pill">—</span>
    <span>探针 <b id="rPx">—</b> 处（曲线−切线）= <b id="rG">—</b></span>
  </div>

  <div class="concl" id="concl">—</div>
</div></div>

<script>
/* ---------- 工具 ---------- */
function tex(el, s, fb){
  try{
    if(typeof katex === 'undefined' || typeof katex.renderToString !== 'function')
      throw new Error('katex unavailable');
    el.innerHTML = katex.renderToString(s, {throwOnError:false, displayMode:false});
  }catch(e){ el.className = 'fb'; el.textContent = fb; }
}
function sf(v, d){
  if(!isFinite(v)) return '—';
  if(Math.abs(v) < 5e-10) v = 0;
  return (v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
}
function niceTicks(lo, hi, n){
  const span = hi - lo;
  if(!(span > 0) || !isFinite(span)) return [lo];
  const raw = span/n, mag = Math.pow(10, Math.floor(Math.log10(raw))), nm = raw/mag;
  let st = nm <= 1 ? 1 : nm <= 2 ? 2 : nm <= 2.5 ? 2.5 : nm <= 5 ? 5 : 10;
  st *= mag;
  const out = [];
  for(let v = Math.ceil(lo/st)*st; v <= hi + 1e-9; v += st) out.push(+(v.toFixed(10)));
  return out;
}
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, txt){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(txt != null) e.textContent = txt;
  return e;
}
const $ = id => document.getElementById(id);

/* ---------- 素材：f(x)=x³−3x（f′、f″ 为解析式，数值经 Python 校验）
     f″(x)=6x：x<0 ⇒ 凸（切线在曲线上方）；x>0 ⇒ 凹（切线在曲线下方）；x=0 拐点。
     恒等式：f(t)−T_{x₀}(t) = (t−x₀)²·(t+2x₀)               ---------- */
const F  = x => x*x*x - 3*x;
const D  = x => 3*x*x - 3;
const D2 = x => 6*x;

const W = 860, H = 196, ML = 44, MR = 18, MT = 12, PY1 = 150;
const BAND_T = 166, BAND_B = 186, TICKY = 161;
const X0 = ML, X1 = W - MR;
const xMin = -2.0, xMax = 2.0, yMin = -2.6, yMax = 2.6;
const SNAP = 0.06;   /* 软吸附到拐点的半径；≥0.06 保证探针仍在 f″ 同号的区间内 */
const FAR  = 0.45;   /* 探针到切点的水平距离 */

const xp = x => X0 + (x - xMin)/(xMax - xMin)*(X1 - X0);
const yp = y => PY1 - (y - yMin)/(yMax - yMin)*(PY1 - MT);

function drawStatic(){
  const gG = $('gGrid'), gA = $('gAxes'), gB = $('gBand'), gL = $('gLabels');
  [gG, gA, gB, gL].forEach(g => { while(g.firstChild) g.removeChild(g.firstChild); });
  $('clipR').setAttribute('width', X1 - X0);
  $('clipR').setAttribute('height', PY1 - MT);

  niceTicks(yMin, yMax, 4).forEach(v => {
    if(Math.abs(v) < 1e-9) return;
    const y = yp(v);
    gG.appendChild(el('line', {x1:X0, y1:y, x2:X1, y2:y, stroke:'#efe9e0', 'stroke-width':1}));
    gG.appendChild(el('text', {x:X0 - 5, y:y + 3.5, 'text-anchor':'end',
      'font-size':10, fill:'#8a908e'}, sf(v, 1)));
  });
  niceTicks(xMin, xMax, 4).forEach(v => {
    if(Math.abs(v) < 1e-9) return;
    const x = xp(v);
    gG.appendChild(el('line', {x1:x, y1:MT, x2:x, y2:PY1, stroke:'#f4efe7', 'stroke-width':1}));
    gG.appendChild(el('text', {x:x, y:TICKY, 'text-anchor':'middle',
      'font-size':10, fill:'#8a908e'}, sf(v, 1)));
  });

  const y0 = yp(0);
  gA.appendChild(el('line', {x1:X0, y1:y0, x2:X1, y2:y0, stroke:'#c9c1b5', 'stroke-width':1.4}));
  gA.appendChild(el('line', {x1:xp(0), y1:MT, x2:xp(0), y2:PY1, stroke:'#d8d1c6', 'stroke-width':1.4}));
  gA.appendChild(el('text', {x:X1 - 2, y:y0 - 5, 'text-anchor':'end',
    'font-size':10.5, fill:'#8a908e'}, 'x'));
  gA.appendChild(el('text', {x:xp(0) + 5, y:MT + 10, 'font-size':10.5, fill:'#8a908e'}, 'y'));

  /* 底部 f″ 符号色带：左 f″<0（凸），右 f″>0（凹），中间是拐点 */
  const half = (xa, xb, c, lab, fill, st) => {
    if(xb <= xa) return;
    gB.appendChild(el('rect', {x:xa + 0.6, y:BAND_T, width:xb - xa - 1.2, height:BAND_B - BAND_T,
      rx:4, fill:fill, stroke:st, 'stroke-width':1}));
    gB.appendChild(el('text', {x:(xa + xb)/2, y:BAND_T + 14, 'text-anchor':'middle',
      'font-size':11.5, 'font-weight':600, fill:c}, lab));
  };
  half(X0, xp(0), '#6b8899', "f″<0 ⇒ 凸（切线在曲线上方）", '#eef3f6', '#cfdae1');
  half(xp(0), X1, '#5c8a6a', "f″>0 ⇒ 凹（切线在曲线下方）", '#e8efeb', '#cbdccf');

  /* 拐点标记 */
  $('cInfl').setAttribute('cx', xp(0));
  $('cInfl').setAttribute('cy', yp(0));
  gL.appendChild(el('text', {x:xp(0) + 8, y:y0 + 15, 'font-size':10.5, fill:'#bf8a3c',
    'font-weight':600, stroke:'#fffdfa', 'stroke-width':3, 'paint-order':'stroke'}, '拐点 (0, 0)'));
}

function render(){
  drawStatic();

  const raw = parseFloat($('sx').value);
  const x0 = Math.abs(raw) < SNAP ? 0 : raw;
  const f0 = F(x0), d0 = D(x0), d20 = D2(x0);
  const T = x => f0 + d0*(x - x0);
  const GAP = t => F(t) - T(t);

  /* 曲线两段（左凸右凹）；每段都要以 M 开头，否则整条路径会被浏览器丢弃 */
  let pl = '', pr = '', plStart = true, prStart = true;
  for(let i = 0; i <= 480; i++){
    const x = xMin + (xMax - xMin)*i/480;
    const px = xp(x).toFixed(2), py = yp(F(x)).toFixed(2);
    if(x <= 0){ pl += (plStart ? 'M' : 'L') + px + ' ' + py; plStart = false; }
    else      { pr += (prStart ? 'M' : 'L') + px + ' ' + py; prStart = false; }
  }
  $('pCurveL').setAttribute('d', pl);
  $('pCurveR').setAttribute('d', pr);
  $('pTanFix').setAttribute('d',
    'M' + xp(xMin) + ' ' + yp(-3*xMin) + 'L' + xp(xMax) + ' ' + yp(-3*xMax));
  $('pTan').setAttribute('d',
    'M' + xp(xMin) + ' ' + yp(T(xMin)) + 'L' + xp(xMax) + ' ' + yp(T(xMax)));

  /* 填充「曲线与切线之间」的区域，按 GAP 的符号分片上色：绿=曲线在上，蓝=切线在上。
     只画在 f″ 与 f″(x₀) 同号的那一侧，这样“整段同色”正好说明该区间内切线始终在曲线同一侧。
     x₀=0（拐点）时不设限制，于是填充色会在 x=0 处由蓝变绿，把“穿过”直接画出来。 */
  const gS = $('gShade');
  while(gS.firstChild) gS.removeChild(gS.firstChild);
  const N = 360;
  let sLo = xMin, sHi = xMax;
  if(x0 > 0) sLo = 0; else if(x0 < 0) sHi = 0;
  const segs = [];
  let runSign = 0, runStart = sLo;
  for(let i = 0; i <= N; i++){
    const t = sLo + (sHi - sLo)*i/N;
    const g = GAP(t);
    const s = g > 1e-9 ? 1 : g < -1e-9 ? -1 : 0;
    if(s === 0) continue;                       /* 切点/交点处跳过，沿用当前段 */
    if(runSign === 0){ runSign = s; runStart = t; }
    else if(s !== runSign){ segs.push({a:runStart, b:t, s:runSign}); runSign = s; runStart = t; }
  }
  if(runSign !== 0) segs.push({a:runStart, b:sHi, s:runSign});
  segs.forEach(sg => {
    if(sg.b - sg.a < 1e-6) return;
    const M = 80;
    let d = '';
    for(let i = 0; i <= M; i++){
      const t = sg.a + (sg.b - sg.a)*i/M;
      d += (i ? 'L' : 'M') + xp(t).toFixed(2) + ' ' + yp(F(t)).toFixed(2);
    }
    for(let i = M; i >= 0; i--){
      const t = sg.a + (sg.b - sg.a)*i/M;
      d += 'L' + xp(t).toFixed(2) + ' ' + yp(T(t)).toFixed(2);
    }
    gS.appendChild(el('path', {d: d + 'Z', fill: sg.s > 0 ? '#dce9e0' : '#e7eef2', stroke: 'none'}));
  });

  /* 探针：x₀±0.45，但必须留在 f″ 同号的区间内，否则结论会被几何假象带偏 */
  const pts = [];
  if(x0 > 0){ pts.push(Math.min(xMax, x0 + FAR)); pts.push(Math.max(0.02, x0 - FAR)); }
  else if(x0 < 0){ pts.push(Math.max(xMin, x0 - FAR)); pts.push(Math.min(-0.02, x0 + FAR)); }
  else { pts.push(FAR); pts.push(-FAR); }

  const gP = $('gProbe');
  while(gP.firstChild) gP.removeChild(gP.firstChild);
  const gaps = [];
  pts.forEach(t => {
    const gap = GAP(t);
    gaps.push(gap);
    const col = gap > 1e-9 ? '#5c8a6a' : gap < -1e-9 ? '#6b8899' : '#8a908e';
    const x = xp(t), ya = yp(T(t)), yb = yp(F(t));
    gP.appendChild(el('line', {x1:x, y1:ya, x2:x, y2:yb, stroke:col, 'stroke-width':3,
      'stroke-linecap':'round'}));
    gP.appendChild(el('line', {x1:x - 4.5, y1:ya, x2:x + 4.5, y2:ya, stroke:col, 'stroke-width':1.6}));
    gP.appendChild(el('line', {x1:x - 4.5, y1:yb, x2:x + 4.5, y2:yb, stroke:col, 'stroke-width':1.6}));
  });

  const ld = $('lDrop');
  ld.setAttribute('x1', xp(x0)); ld.setAttribute('x2', xp(x0));
  ld.setAttribute('y1', yp(0));  ld.setAttribute('y2', yp(f0));
  const cp = $('cPt');
  cp.setAttribute('cx', xp(x0)); cp.setAttribute('cy', yp(f0));

  const atInfl = Math.abs(d20) < 1e-9;
  const state = atInfl ? '拐点' : d20 > 0 ? '凹' : '凸';

  $('vx').textContent   = sf(x0, 3);
  $('rF').textContent   = sf(f0, 3);
  $('rD').textContent   = sf(d0, 3);
  $('rD2').textContent  = sf(d20, 3);
  $('rPx').textContent  = 'x=' + sf(pts[1], 2) + '、' + sf(pts[0], 2);
  $('rG').textContent   = sf(gaps[1], 3) + ' ／ ' + sf(gaps[0], 3);

  const ps = $('pillS');
  ps.className = 'pill ' + (atInfl ? 'gd' : d20 > 0 ? 'ao' : 'tu');
  ps.textContent = 'f″' + (atInfl ? '=0' : d20 > 0 ? '>0' : '<0') + ' ⇒ ' + state;

  const pp = $('pillP');
  if(atInfl){ pp.className = 'pill gd'; pp.textContent = '切线穿过曲线（凹凸分界）'; }
  else if(d20 > 0){ pp.className = 'pill ao'; pp.textContent = '切线在曲线下方'; }
  else { pp.className = 'pill tu'; pp.textContent = '切线在曲线上方'; }

  tex($('tF'),  'f(x)=x^{3}-3x,\\qquad x_0=' + sf(x0, 3), 'f(x)=x^3-3x，x0=' + sf(x0, 3));
  tex($('tD'),  "f'(x)=3x^{2}-3=" + sf(d0, 3), "f'(x0)=" + sf(d0, 3));
  tex($('tD2'), 'f\x27\x27(x)=6x=' + sf(d20, 3), "f''(x0)=" + sf(d20, 3));

  /* 底部「一句话本质」 */
  const C = $('concl');
  let extra = '';
  if(!atInfl && Math.abs(x0) < 0.4)
    extra = ' <span class="k">（x₀ 已很接近拐点：凹凸马上要翻转，切线两侧的关系会在 x=0 处立刻互换。）</span>';

  if(atInfl){
    C.innerHTML = '<span class="k">一句话本质：</span>拐点处 f″(x₀)=<b>0</b> 且左右<b>变号</b>：'
      + '左侧 f″&lt;0 是凸、右侧 f″&gt;0 是凹，所以 (0,0) 是凹凸的<b>分界点</b>，'
      + '切线正好<b>穿过</b>曲线（探针值一负一正：' + sf(gaps[0], 3) + ' 与 ' + sf(gaps[1], 3) + '，'
      + '填充色也在 x=0 处由蓝变绿）。'
      + '<span class="k">拐点不是“曲线拐弯”，而是“弯曲方向换边”的转向点。</span>';
  } else if(d20 > 0){
    C.innerHTML = '<span class="k">一句话本质：</span>f″(x₀)=6x₀=<b>' + sf(d20, 3) + '</b>&gt;0 ⇒ 曲线在 x₀ 处是<b>凹</b>的，'
      + '处在凹区间的整段里<b>曲线都高于切线</b>（填充为绿）；探针 x=' + sf(pts[1], 2) + '、' + sf(pts[0], 2)
      + ' 处（曲线−切线）= ' + sf(gaps[1], 3) + '、' + sf(gaps[0], 3) + '，都为正。'
      + '<span class="k">本质是最小二阶项：(1/2)f″(x₀)(x−x₀)² 的符号＝ f″(x₀) 的符号，它决定曲线偏向切线的哪一侧。</span>'
      + extra;
  } else {
    C.innerHTML = '<span class="k">一句话本质：</span>f″(x₀)=6x₀=<b>' + sf(d20, 3) + '</b>&lt;0 ⇒ 曲线在 x₀ 处是<b>凸</b>的，'
      + '处在凸区间的整段里<b>切线都高于曲线</b>（填充为蓝）；探针 x=' + sf(pts[1], 2) + '、' + sf(pts[0], 2)
      + ' 处（曲线−切线）= ' + sf(gaps[1], 3) + '、' + sf(gaps[0], 3) + '，都为负。'
      + '<span class="k">本质是最小二阶项：(1/2)f″(x₀)(x−x₀)² 的符号＝ f″(x₀) 的符号，它决定曲线偏向切线的哪一侧。</span>'
      + extra;
  }
}

/* ---------- 交互 ---------- */
const svg = $('plot');
let dragging = false;
function setX(v){ $('sx').value = v; render(); }
function setFromClientX(cx){
  const r = svg.getBoundingClientRect();
  const vx = (cx - r.left)/r.width*W;
  let x = xMin + (vx - X0)/(X1 - X0)*(xMax - xMin);
  x = Math.max(-1.9, Math.min(1.9, x));
  setX(Math.round(x*1000)/1000);
}
svg.addEventListener('pointerdown', e => {
  dragging = true;
  try{ svg.setPointerCapture(e.pointerId); }catch(err){}
  setFromClientX(e.clientX);
});
svg.addEventListener('pointermove', e => { if(dragging) setFromClientX(e.clientX); });
svg.addEventListener('pointerup', e => {
  dragging = false;
  try{ svg.releasePointerCapture(e.pointerId); }catch(err){}
});
svg.addEventListener('pointercancel', () => { dragging = false; });
svg.addEventListener('pointerleave', () => { dragging = false; });

$('sx').addEventListener('input', render);
$('bGo').addEventListener('click', () => setX(0));
$('bA').addEventListener('click', () => setX(-1.2));
$('bB').addEventListener('click', () => setX(1.2));

render();
window.__demoReady = true;
</script>
