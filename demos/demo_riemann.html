<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>定积分的定义 · 黎曼和逼近面积</title>
<link rel="stylesheet" href="../assets/katex/katex.min.css">
<style>
:root{--page:#f7f4ef;--surface:#ffffff;--ink:#2a2f2e;--muted:#8a908e;--line:#e5dfd6;--sage:#6e8b7b;--sage-deep:#4e6a5b;--blue:#6b8899;--sand:#b39a6e;--rose:#b5705f;--mauve:#93899c;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;background:var(--page);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:10px 14px 12px}
h1{font-size:16px;margin:0 0 2px;font-weight:600;letter-spacing:.2px}
.sub{font-size:12px;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:7px 0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.bar label{font-size:12px;color:var(--muted)}
select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;flex:1;min-width:140px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:var(--line);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-5px;border-radius:50%;background:var(--sage-deep);border:2px solid var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.18)}
input[type=range]::-moz-range-track{height:5px;background:var(--line);border-radius:3px}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:2px solid var(--surface);border-radius:50%;background:var(--sage-deep)}
.val{font-variant-numeric:tabular-nums;font-weight:600;color:var(--sage-deep);min-width:2.6em;display:inline-block}
.grid{display:grid;grid-template-columns:1fr 208px;gap:8px}
.grid .card{padding:5px}
canvas{display:block;width:100%;height:206px}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.st{flex:1;min-width:118px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.st .k{font-size:11px;color:var(--muted)}
.st .v{font-size:15px;font-variant-numeric:tabular-nums;font-weight:600}
.st .tex{font-size:12px;overflow:hidden}
.concl{margin-top:7px;background:#eef1ec;border:1px solid var(--line);border-left:3px solid var(--sage-deep);border-radius:8px;padding:6px 9px;font-size:12.4px}
.concl b{color:var(--sage-deep)}
@media (max-width:640px){.grid{grid-template-columns:1fr}canvas{height:190px}}
@media (max-width:520px){.st .tex{font-size:10.5px}.st{min-width:132px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>定积分的定义 · 黎曼和逼近面积</h1>
  <p class="sub">把 [0,1] 分成 n 份，每份用 <span class="tex" data-tex="f(\xi_i)\,\Delta x"></span> 近似，累加得矩形和 <span class="tex" data-tex="S_n=\sum_{i=1}^{n}f(\xi_i)\Delta x"></span>；n 越大越贴近曲边梯形面积。</p>

  <div class="bar">
    <label>被积函数</label>
    <select id="fn">
      <option value="sq">f(x) = x²</option>
      <option value="cube">f(x) = x³</option>
      <option value="sin">f(x) = sin x</option>
    </select>
    <label>取点方式</label>
    <select id="mode">
      <option value="left">左端点</option>
      <option value="mid">中点</option>
    </select>
    <label>n =</label><span class="val" id="nv">100</span>
    <input type="range" id="nn" min="1" max="200" step="1" value="100">
  </div>

  <div class="grid">
    <div class="card"><canvas id="main"></canvas></div>
    <div class="card"><canvas id="err"></canvas></div>
  </div>

  <div class="stats">
    <div class="st"><div class="k">矩形和 S<sub>n</sub>（当前）</div><div class="v" id="vSn">—</div></div>
    <div class="st"><div class="k">精确值 I（定积分）</div><div class="v" id="vI">—</div><div class="tex" id="iTex" data-tex="\int_{0}^{1}x^{2}\,dx=\dfrac{1}{3}"></div></div>
    <div class="st"><div class="k">误差 |S<sub>n</sub> − I|</div><div class="v" id="vE">—</div><div class="k" id="vEscale">—</div></div>
    <div class="st"><div class="k">极限（与分法无关）</div><div class="tex" data-tex="\lim\limits_{n\to\infty}S_n=\int_{0}^{1}f(x)\,dx"></div></div>
  </div>

  <div class="concl"><b>一句话本质：</b><span id="ctxt">—</span> <span class="tex" id="ctex" data-tex="\int_{0}^{1}x^{2}\,dx=\dfrac{1}{3}"></span></div>
</div>

<script src="../assets/katex/katex.min.js"></script>
<script>
(function(){
  "use strict";
  var C={ink:'#2a2f2e',muted:'#8a908e',line:'#e5dfd6',sage:'#6e8b7b',sageDeep:'#4e6a5b',blue:'#6b8899',sand:'#b39a6e',rose:'#b5705f',mauve:'#93899c'};
  var $=function(s){return document.querySelector(s);};

  /* ---------- KaTeX（带兜底，绝不白屏） ---------- */
  function kt(el){
    if(!el) return;
    var s=el.getAttribute('data-tex'); if(s===null) return;
    try{
      if(window.katex && typeof katex.renderToString==='function'){
        el.innerHTML=katex.renderToString(s,{displayMode:el.hasAttribute('data-display'),throwOnError:false,strict:false});
        return;
      }
    }catch(e){ /* 落到纯文本兜底 */ }
    el.textContent=s.replace(/\\[a-zA-Z]+/g,' ').replace(/[{}]/g,'').replace(/\s+/g,' ').trim();
  }
  function renderTex(root){ var n=(root||document).querySelectorAll('.tex'); for(var i=0;i<n.length;i++) kt(n[i]); }
  function setTex(el,s){ if(!el) return; el.setAttribute('data-tex',s); kt(el); }

  /* ---------- 工具 ---------- */
  var SUP={'-':'\u207B','0':'\u2070','1':'\u00B9','2':'\u00B2','3':'\u00B3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079'};
  function sup(n){ return String(n).split('').map(function(c){return SUP[c]||c;}).join(''); }
  function fmtErr(v){
    if(!isFinite(v)) return '—';
    if(v===0) return '0';
    var e=Math.floor(Math.log10(Math.abs(v))), m=v/Math.pow(10,e);
    if(e>=-1 && e<=0) return v.toFixed(4);
    return m.toFixed(2)+'\u00D710'+sup(e);
  }
  function fit(cv){
    var dpr=Math.max(1,window.devicePixelRatio||1);
    var w=cv.clientWidth||600, h=cv.clientHeight||272;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    var ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    return {ctx:ctx,w:w,h:h};
  }
  function mono(ctx,size){ ctx.font=size+'px "Segoe UI","Microsoft YaHei",sans-serif'; }

  /* ---------- 被积函数表 ---------- */
  var F={
    sq:{name:'x\u00B2',tex:'x^{2}',f:function(x){return x*x;},fp0:0,fp1:2,I:1/3,ival:'1/3',
        itex:'\\int_{0}^{1}x^{2}\\,dx=\\dfrac{1}{3}',itexShort:'\\int_{0}^{1}x^{2}\\,dx=\\dfrac{1}{3}'},
    cube:{name:'x\u00B3',tex:'x^{3}',f:function(x){return x*x*x;},fp0:0,fp1:3,I:0.25,ival:'1/4',
        itex:'\\int_{0}^{1}x^{3}\\,dx=\\dfrac{1}{4}',itexShort:'\\int_{0}^{1}x^{3}\\,dx=\\dfrac{1}{4}'},
    sin:{name:'sin x',tex:'\\sin x',f:Math.sin,fp0:1,fp1:Math.cos(1),I:1-Math.cos(1),ival:'1\u2212cos 1',
        itex:'\\int_{0}^{1}\\sin x\\,dx=1-\\cos 1\\approx0.45970',itexShort:'1-\\cos 1\\approx0.45970'}
  };
  var YMAX=1.1;
  var n=100, key='sq', mode='left';

  function riemann(f,nn,md){
    var h=1/nn, s=0;
    for(var i=0;i<nn;i++){ s += f(md==='left'? i*h : (i+0.5)*h); }
    return s*h;
  }

  /* ---------- 左图：曲线 + n 个矩形 ---------- */
  function drawMain(){
    var g=fit($('#main')), ctx=g.ctx, w=g.w, h=g.h, fn=F[key].f;
    var m={l:44,r:14,t:26,b:26};
    var X=function(v){ return m.l+v*(w-m.l-m.r); };
    var Y=function(v){ return h-m.b-(v/YMAX)*(h-m.t-m.b); };

    // 网格
    ctx.strokeStyle=C.line; ctx.lineWidth=1; ctx.fillStyle=C.muted; mono(ctx,10.5);
    var i;
    for(i=0;i<=4;i++){
      var gx=i/4; ctx.beginPath(); ctx.moveTo(X(gx),Y(0)); ctx.lineTo(X(gx),Y(YMAX-0.1)); ctx.stroke();
      ctx.textAlign='center'; ctx.fillText(gx.toFixed(2),X(gx),h-m.b+14);
    }
    for(i=0;i<=2;i++){
      var gy=0.5*i; ctx.beginPath(); ctx.moveTo(X(0),Y(gy)); ctx.lineTo(X(1),Y(gy)); ctx.stroke();
      ctx.textAlign='right'; ctx.fillText(gy.toFixed(1),X(0)-5,Y(gy)+3.5);
    }
    // 坐标轴
    ctx.strokeStyle=C.ink; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(1)+6,Y(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(0),Y(0)); ctx.lineTo(X(0),Y(YMAX-0.1)); ctx.stroke();

    // 真实面积（沙色）
    var K=260, k;
    ctx.beginPath(); ctx.moveTo(X(0),Y(0));
    for(k=0;k<=K;k++){ var xk=k/K; ctx.lineTo(X(xk),Y(fn(xk))); }
    ctx.lineTo(X(1),Y(0)); ctx.closePath();
    ctx.fillStyle='rgba(179,154,110,.26)'; ctx.fill();

    // n 个矩形
    var hw=(w-m.l-m.r)/n, hx=1/n;
    var thick=hw>3.2;
    ctx.fillStyle='rgba(130,149,139,.34)';
    ctx.strokeStyle='rgba(79,107,95,.85)'; ctx.lineWidth=thick?1:0.8;
    for(i=0;i<n;i++){
      var xi=(mode==='left')? i*hx : (i+0.5)*hx;
      var yv=fn(xi), x0=X(i*hx), x1=X((i+1)*hx), y1=Y(yv), y0=Y(0);
      ctx.beginPath(); ctx.rect(x0,y1,Math.max(x1-x0,0.6),y0-y1);
      ctx.fill(); if(thick) ctx.stroke();
    }

    // 曲线
    ctx.strokeStyle=C.blue; ctx.lineWidth=2.2; ctx.beginPath();
    for(k=0;k<=K;k++){ var xc=k/K; if(k===0) ctx.moveTo(X(xc),Y(fn(xc))); else ctx.lineTo(X(xc),Y(fn(xc))); }
    ctx.stroke();

    // 标题 + 图例（左上角空白处）
    mono(ctx,11); ctx.fillStyle=C.ink; ctx.textAlign='left';
    ctx.fillText('f(x) = '+F[key].name+'　　n = '+n+'　'+(mode==='left'?'左端点':'中点')+'矩形',X(0),14);
    mono(ctx,10.5);
    var lx=X(0)+12, ly=Y(YMAX-0.1)+24;
    ctx.fillStyle='rgba(130,149,139,.5)'; ctx.strokeStyle=C.sageDeep; ctx.lineWidth=1;
    ctx.beginPath(); ctx.rect(lx,ly-9,11,11); ctx.fill(); ctx.stroke();
    ctx.fillStyle=C.sageDeep; ctx.fillText('矩形和 S\u2099',lx+16,ly+1);
    ctx.fillStyle='rgba(179,154,110,.6)'; ctx.strokeStyle=C.sand;
    ctx.beginPath(); ctx.rect(lx,ly+13,11,11); ctx.fill(); ctx.stroke();
    ctx.fillStyle=C.sand; ctx.fillText('真实面积 I',lx+16,ly+23);
    ctx.strokeStyle=C.blue; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.moveTo(lx,ly+41); ctx.lineTo(lx+11,ly+41); ctx.stroke();
    ctx.fillStyle=C.blue; ctx.fillText('f(x)',lx+16,ly+45);
  }

  /* ---------- 右图：误差随 n 的变化（对数轴） ---------- */
  var NMAX=200;
  function errSeries(){
    var f=F[key].f, I=F[key].I, out=[];
    for(var k=1;k<=NMAX;k++){ out.push(Math.abs(riemann(f,k,mode)-I)); }
    return out;
  }
  function refCoef(){
    var f=F[key].f;
    if(mode==='left') return {c:Math.abs(f(1)-f(0))/2, power:1, tex:'C/n'};
    return {c:Math.abs(F[key].fp1-F[key].fp0)/24, power:2, tex:'C/n\u00B2'};
  }
  function drawErr(series){
    var g=fit($('#err')), ctx=g.ctx, w=g.w, h=g.h;
    var m={l:38,r:8,t:24,b:22};
    var LO=-6.6, HI=-0.2;
    var X=function(k){ return m.l+(k-1)/(NMAX-1)*(w-m.l-m.r); };
    var Y=function(v){
      var lg=(v>0)? Math.log10(v) : LO-1;
      var t=(lg-LO)/(HI-LO); if(t<0) t=0; if(t>1) t=1;
      return h-m.b-t*(h-m.t-m.b);
    };
    ctx.strokeStyle=C.line; ctx.lineWidth=1; mono(ctx,10); 
    var exps=[0,-2,-4,-6], i;
    for(i=0;i<exps.length;i++){
      var yv=Math.pow(10,exps[i]); ctx.beginPath(); ctx.moveTo(X(1),Y(yv)); ctx.lineTo(X(NMAX),Y(yv)); ctx.stroke();
      ctx.fillStyle=C.muted; ctx.textAlign='right'; ctx.fillText('10'+sup(exps[i]),X(1)-3,Y(yv)+3.5);
    }
    ctx.strokeStyle=C.ink; ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.moveTo(X(1),Y(1)); ctx.lineTo(X(1),Y(Math.pow(10,LO))); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(1),Y(Math.pow(10,LO))); ctx.lineTo(X(NMAX),Y(Math.pow(10,LO))); ctx.stroke();

    // 渐近参考线
    var rc=refCoef();
    ctx.strokeStyle=C.mauve; ctx.lineWidth=1.3; ctx.setLineDash([4,3]); ctx.beginPath();
    for(var k=1;k<=NMAX;k++){
      var rv=rc.c/Math.pow(k,rc.power);
      if(k===1) ctx.moveTo(X(k),Y(rv)); else ctx.lineTo(X(k),Y(rv));
    }
    ctx.stroke(); ctx.setLineDash([]);

    // 误差曲线
    ctx.strokeStyle=C.sageDeep; ctx.lineWidth=1.8; ctx.beginPath();
    for(k=0;k<series.length;k++){ if(k===0) ctx.moveTo(X(k+1),Y(series[k])); else ctx.lineTo(X(k+1),Y(series[k])); }
    ctx.stroke();
    // 当前点
    var cur=series[n-1];
    ctx.fillStyle=C.rose; ctx.beginPath(); ctx.arc(X(n),Y(cur),4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(175,133,130,.45)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(X(n),Y(cur)); ctx.lineTo(X(n),Y(Math.pow(10,LO))); ctx.stroke();

    mono(ctx,10.5); ctx.fillStyle=C.ink; ctx.textAlign='left';
    ctx.fillText('误差随 n 减小（对数纵轴）',m.l-30,14);
    ctx.fillStyle=C.mauve; ctx.fillText('虚线：渐近 '+rc.tex+'\uFF08C\u2248'+rc.c.toFixed(2)+'\uFF09',m.l-32,h-5);
    ctx.fillStyle=C.muted; ctx.textAlign='right'; ctx.fillText('n',X(NMAX),h-17);
  }

  /* ---------- 数值区 + 结论条 ---------- */
  function update(){
    var f=F[key].f, I=F[key].I;
    var S=riemann(f,n,mode), e=Math.abs(S-I);
    $('#nv').textContent=n;
    $('#vSn').textContent=S.toFixed(6);
    $('#vI').textContent=I.toFixed(6);
    setTex($('#iTex'), F[key].itex);
    $('#vE').textContent=fmtErr(e);
    var rc=refCoef();
    $('#vEscale').textContent = (mode==='left')
      ? '误差\u00B7n = '+(e*n).toFixed(4)+'  \u2192 收敛速度 \u2248 1/n'
      : '误差\u00B7n\u00B2 = '+(e*n*n).toFixed(4)+'  \u2192 收敛速度 \u2248 1/n\u00B2';

    var txt='把 [0,1] 均分成 n='+n+' 份，用'+(mode==='left'?'左端点':'中点')+'的高求和：S\u2099='+S.toFixed(6)
      +'，与真值 '+I.toFixed(6)+' 只差 '+fmtErr(e)
      +'（'+(mode==='left'?'误差\u00B7n\u2248'+(e*n).toFixed(3)+'\uFF0C即误差 ~ C/n':'误差\u00B7n\u00B2\u2248'+(e*n*n).toFixed(3)+'\uFF0C即误差 ~ C/n\u00B2，收敛更快')
      +'）。n 继续变大，矩形越来越细，S\u2099 的极限就是 ';
    $('#ctxt').textContent=txt;
    setTex($('#ctex'), F[key].itexShort+'='+I.toFixed(6));

    drawMain();
    drawErr(errSeries());
  }

  /* ---------- 事件 ---------- */
  var slider=$('#nn');
  function onSlider(){ n=parseInt(slider.value,10)||1; update(); }
  slider.addEventListener('input',onSlider);
  $('#fn').addEventListener('input',function(){ key=this.value; update(); });
  $('#mode').addEventListener('input',function(){ mode=this.value; update(); });
  slider.addEventListener('change',onSlider);
  window.addEventListener('resize',function(){ drawMain(); drawErr(errSeries()); });

  var boot=function(){
    renderTex(document);
    // 初始渲染；若某些环境拿不到 clientWidth，用 rAF 再补一次
    update();
    if(window.requestAnimationFrame) requestAnimationFrame(function(){ drawMain(); drawErr(errSeries()); });
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
  // KaTeX 脚本若比本脚本晚到，再渲染一次公式
  window.addEventListener('load',function(){ renderTex(document); update(); });
})();
</script>
</body>
</html>
