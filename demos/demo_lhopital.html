<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>洛必达法则 · 两个比值同时趋近同一个数</title>
<link rel="stylesheet" href="../assets/katex/katex.min.css">
<script src="../assets/katex/katex.min.js"></script>
<style>
:root{
  --bg:#f7f4ef;--surface:#ffffff;--ink:#2a2f2e;--ink2:#535a59;--muted:#8a908e;
  --line:#e5dfd6;--p:#6e8b7b;--p-deep:#4e6a5b;--p-soft:#e8efeb;--ok:#5c8a6a;
  --warn:#bf8a3c;--bad:#b5705f;--info:#6b8899;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:10px 14px 9px;box-shadow:0 1px 3px rgba(47,53,55,.05)}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:15.5px;font-weight:600;letter-spacing:.2px}
h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
button{font-family:inherit;font-size:12px;color:var(--ink);background:#f1eee8;
  border:1px solid var(--line);border-radius:8px;padding:3px 10px;cursor:pointer}
button:hover{background:#eae5dc}
button.on{background:var(--p-deep);border-color:var(--p-deep);color:#fbfbf8}
.strip{min-height:30px;display:flex;align-items:center;gap:10px;margin:5px 0 3px;
  padding:3px 8px;background:var(--p-soft);border:1px solid #dbe4de;border-radius:9px;
  font-size:13.5px;overflow:hidden;white-space:nowrap;flex-wrap:wrap}
.strip .katex{font-size:1em}
#stripVal{font-family:Consolas,"Courier New",monospace;font-size:11.5px;color:var(--ink2);
  border-left:1px solid #cfe0d3;padding-left:10px}
.fb{font-family:Consolas,"Courier New",monospace;font-size:12px;color:var(--ink2)}
#plot{display:block;width:100%;height:184px;background:#fffdfa;border:1px solid var(--line);border-radius:10px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:3px 0 0}
.legend i{display:inline-block;width:15px;height:0;border-top-width:2.5px;border-top-style:solid;
  vertical-align:middle;margin-right:4px}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.slot{display:flex;align-items:center;gap:7px;flex:1 1 300px;min-width:230px}
.slot label{font-size:12.5px;color:var(--ink2);white-space:nowrap}
input[type=range]{flex:1 1 auto;min-width:80px;height:18px;accent-color:var(--p-deep);
  background:transparent;cursor:pointer}
.val{font-family:Consolas,"Courier New",monospace;font-size:12.5px;color:var(--p-deep);
  min-width:52px;text-align:right}
.read{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 8px;margin:2px 0 6px}
.kv{background:#f6f3ed;border:1px solid var(--line);border-radius:8px;padding:3px 7px;
  font-size:11.5px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.kv b{display:block;font-family:Consolas,"Courier New",monospace;font-size:12.5px;
  color:var(--ink);font-weight:600;margin-top:1px}
.kv.g b{color:var(--p-deep)}
.concl{border-left:3px solid var(--p-deep);background:var(--p-soft);border-radius:0 8px 8px 0;
  padding:7px 11px;font-size:12.5px;line-height:1.5;min-height:44px}
.concl b{font-family:Consolas,"Courier New",monospace;color:var(--p-deep)}
.concl .tag{color:var(--bad);font-weight:600}
svg text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
@media(max-width:560px){.read{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="head">
    <h1>洛必达法则 · 两个比值同趋一值<small id="sub">f(x)=sin x，g(x)=x，x→0</small></h1>
    <div class="btns">
      <button id="ba" class="on">sin x / x，x→0</button>
      <button id="bb">(x²−1)/(x−1)，x→1</button>
      <button id="bdir">从右侧趋近 ▸</button>
    </div>
  </div>

  <div class="strip"><span id="stripTex">—</span><span id="stripVal"></span></div>

  <svg id="plot" viewBox="0 0 860 184" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="原比值与导数比值同时趋近同一个极限的动态图">
    <defs><clipPath id="clip"><rect x="46" y="8" width="800" height="140"></rect></clipPath></defs>
    <g id="gGrid"></g><g id="gAxes"></g><g id="gTicks"></g>
    <g clip-path="url(#clip)">
      <path id="pLim" fill="none" stroke="#bf8a3c" stroke-width="1.6" stroke-dasharray="7 5"></path>
      <path id="pR" fill="none" stroke="#6e8b7b" stroke-width="2.6" stroke-linejoin="round"></path>
      <path id="pD" fill="none" stroke="#6b8899" stroke-width="2.4" stroke-linejoin="round"></path>
      <line id="lX" stroke="#b5705f" stroke-width="1.3" stroke-dasharray="4 4"></line>
      <circle id="cR" r="5.2" fill="#6e8b7b" stroke="#fffdfa" stroke-width="1.7"></circle>
      <circle id="cD" r="5.2" fill="#6b8899" stroke="#fffdfa" stroke-width="1.7"></circle>
    </g>
    <g id="gLabels"></g>
  </svg>

  <div class="legend">
    <span><i style="border-top-color:#6e8b7b"></i>原函数之比 f(x)/g(x)</span>
    <span><i style="border-top-color:#6b8899"></i>导数之比 f′(x)/g′(x)</span>
    <span><i style="border-top-color:#bf8a3c;border-top-style:dashed"></i>极限值 L</span>
    <span><i style="border-top-color:#b5705f;border-top-style:dashed"></i>当前取点 x</span>
  </div>

  <div class="ctrl">
    <div class="slot">
      <label for="sd">离 x₀ 的距离 δ =</label>
      <input id="sd" type="range" min="0.01" max="1" step="0.01" value="0.6">
      <span class="val" id="vd">0.60</span>
    </div>
  </div>

  <div class="read">
    <div class="kv">当前点 x<b id="rx">—</b></div>
    <div class="kv">f(x) / g(x) = ?<b id="rR" class="g">—</b></div>
    <div class="kv">f′(x) / g′(x) = ?<b id="rD" class="g">—</b></div>
    <div class="kv">两者之差<b id="rE">—</b></div>
  </div>

  <div class="concl" id="concl">—</div>
</div></div>

<script>
/* ================= 工具 ================= */
function tex(el, s, fb){
  try{
    if(typeof katex === 'undefined' || typeof katex.renderToString !== 'function')
      throw new Error('katex unavailable');
    el.className = '';
    el.innerHTML = katex.renderToString(s, {throwOnError:false, displayMode:false});
  }catch(e){
    el.className = 'fb';
    el.textContent = fb;
  }
}
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function nf(v, d){
  if(v === null || v === undefined) return '—';
  if(!isFinite(v)) return '—';
  if(Math.abs(v) < 5e-13) v = 0;
  return v.toFixed(d);
}
function niceTicks(lo, hi, n){
  const span = hi - lo;
  if(!(span > 0) || !isFinite(span)) return [lo];
  const raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), nm = raw / mag;
  let st = nm <= 1 ? 1 : nm <= 2 ? 2 : nm <= 2.5 ? 2.5 : nm <= 5 ? 5 : 10;
  st *= mag;
  const out = [];
  for(let v = Math.ceil(lo/st)*st; v <= hi + 1e-9; v += st) out.push(+(v.toFixed(10)));
  return out;
}

/* ================= 两个素材（公式即真值来源） ================= */
const CASES = {
  a: {
    sub:'f(x)=sin x，g(x)=x，x→0', dirMode:'right',
    x0:0, xMin:-1.25, xMax:1.25, lim:1,
    f:x=>Math.sin(x), g:x=>x, df:x=>Math.cos(x), dg:x=>1,
    fT:'\\sin x', gT:'x', dfT:'\\cos x', dgT:'1'
  },
  b: {
    sub:'f(x)=x²−1，g(x)=x−1，x→1', dirMode:'right',
    x0:1, xMin:0.05, xMax:2.35, lim:2,
    f:x=>x*x-1, g:x=>x-1, df:x=>2*x, dg:x=>1,
    fT:'x^{2}-1', gT:'x-1', dfT:'2x', dgT:'1'
  }
};
let cur = 'a', C = CASES[cur], dir = 1;   /* dir=+1 右侧趋近，dir=-1 左侧趋近 */

/* ================= 画布几何 ================= */
const W = 860, H = 184, ML = 46, MR = 14, MT = 8, MB = 34;
const PX0 = ML, PX1 = W - MR, PY0 = MT, PY1 = H - MB;
document.getElementById('clip').firstElementChild.setAttribute('x', PX0);
document.getElementById('clip').firstElementChild.setAttribute('y', PY0);
document.getElementById('clip').firstElementChild.setAttribute('width', PX1 - PX0);
document.getElementById('clip').firstElementChild.setAttribute('height', PY1 - PY0);

const ratioX  = (c, x) => c.f(x) / c.g(x);     /* 原函数之比 */
const ratioD  = (c, x) => c.df(x) / c.dg(x);   /* 导数之比   */

/* y 轴范围：采样两条曲线 + 极限值 L，极值处截断 */
function yDomain(c){
  let lo = c.lim, hi = c.lim;
  const push = v => { if(isFinite(v)){ if(v<lo) lo=v; if(v>hi) hi=v; } };
  push(ratioD(c, c.xMin)); push(ratioD(c, c.xMax));
  for(let i=0;i<=600;i++){
    const x = c.xMin + (c.xMax - c.xMin) * i/600;
    if(Math.abs(x - c.x0) < 0.02) continue;
    push(ratioX(c, x));
  }
  /* 曲线在 x₀ 附近被截断，避免纵向失控 */
  const cap = (hi - lo) , lim = c.lim + (cap > 0 ? cap*2.2 : 1);
  lo = Math.max(lo, c.lim - (cap > 0 ? cap*2.2 : 1));
  hi = Math.min(hi, lim);
  const pad = (hi - lo) * 0.14 || 0.5;
  return {yMin: lo - pad, yMax: hi + pad};
}

/* ================= 渲染 ================= */
function render(){
  const d = +document.getElementById('sd').value;
  const xNow = C.x0 + dir * d;
  const dom = yDomain(C);
  const X = x => PX0 + (x - C.xMin)/(C.xMax - C.xMin)*(PX1 - PX0);
  const Y = y => PY1 - (y - dom.yMin)/(dom.yMax - dom.yMin)*(PY1 - PY0);

  /* --- 网格 / 轴 / 刻度 --- */
  const gG = document.getElementById('gGrid'), gA = document.getElementById('gAxes'),
        gT = document.getElementById('gTicks');
  gG.innerHTML = ''; gA.innerHTML = ''; gT.innerHTML = '';
  const xt = niceTicks(C.xMin, C.xMax, 6), yt = niceTicks(dom.yMin, dom.yMax, 5);
  xt.forEach(v => gG.appendChild(el('line', {x1:X(v),y1:PY0,x2:X(v),y2:PY1,
    stroke:'#ece7de','stroke-width':1})));
  yt.forEach(v => gG.appendChild(el('line', {x1:PX0,y1:Y(v),x2:PX1,y2:Y(v),
    stroke:'#ece7de','stroke-width':1})));
  if(dom.yMin < 0 && dom.yMax > 0)
    gA.appendChild(el('line', {x1:PX0,y1:Y(0),x2:PX1,y2:Y(0),stroke:'#c8c0b4','stroke-width':1.3}));
  if(C.xMin < 0 && C.xMax > 0)
    gA.appendChild(el('line', {x1:X(0),y1:PY0,x2:X(0),y2:PY1,stroke:'#c8c0b4','stroke-width':1.3}));
  xt.forEach(v => {
    const t = el('text', {x:X(v), y:PY1+14, 'font-size':10.5, fill:'#8a908e','text-anchor':'middle'});
    t.textContent = nf(v, Math.abs(v) < 10 && v % 1 !== 0 ? 2 : 0);
    gT.appendChild(t);
  });
  yt.forEach(v => {
    const t = el('text', {x:PX0-6, y:Y(v)+3.5, 'font-size':10.5, fill:'#8a908e','text-anchor':'end'});
    t.textContent = nf(v, Math.abs(v) < 10 && v % 1 !== 0 ? 1 : 0);
    gT.appendChild(t);
  });

  /* --- 极限水平线 --- */
  document.getElementById('pLim').setAttribute('d',
    `M ${PX0} ${Y(C.lim)} L ${PX1} ${Y(C.lim)}`);

  /* --- 两条比值曲线 --- */
  let dR = '', dD = '';
  for(let i=0;i<=800;i++){
    const x = C.xMin + (C.xMax - C.xMin)*i/800;
    if(Math.abs(x - C.x0) > 0.012){
      const v = ratioX(C, x);
      if(isFinite(v) && v >= dom.yMin && v <= dom.yMax)
        dR += (dR ? ' L ' : 'M ') + X(x).toFixed(2) + ' ' + Y(v).toFixed(2);
      const w = ratioD(C, x);
      if(isFinite(w) && w >= dom.yMin && w <= dom.yMax)
        dD += (dD ? ' L ' : 'M ') + X(x).toFixed(2) + ' ' + Y(w).toFixed(2);
    }
  }
  document.getElementById('pR').setAttribute('d', dR);
  document.getElementById('pD').setAttribute('d', dD);

  /* --- 当前点 --- */
  const vR = ratioX(C, xNow), vD = ratioD(C, xNow);
  document.getElementById('lX').setAttribute('x1', X(xNow));
  document.getElementById('lX').setAttribute('x2', X(xNow));
  document.getElementById('lX').setAttribute('y1', PY0);
  document.getElementById('lX').setAttribute('y2', PY1);
  const cR = document.getElementById('cR'), cD = document.getElementById('cD');
  cR.setAttribute('cx', X(xNow)); cR.setAttribute('cy', Y(vR));
  cD.setAttribute('cx', X(xNow)); cD.setAttribute('cy', Y(vD));

  /* --- 图上文字 --- */
  const gL = document.getElementById('gLabels'); gL.innerHTML = '';
  const mk = (x, y, s, fill, anchor, dx, dy, size) => {
    const t = el('text', {x:x+dx, y:y+dy, 'font-size':size||11.5, fill:fill,
      'text-anchor':anchor||'start','font-weight':500});
    t.textContent = s; gL.appendChild(t);
  };
  mk(PX1-4, Y(C.lim), '极限 L = '+nf(C.lim,0), '#bf8a3c', 'end', 0, -6);
  const right = X(xNow) > (PX0+PX1)/2;
  mk(X(xNow), Y(vR), 'f/g = '+nf(vR,5), '#4e6a5b', right?'end':'start', right?-9:9, -7);
  mk(X(xNow), Y(vD), 'f′/g′ = '+nf(vD,5), '#6b8899', right?'end':'start', right?-9:9, 15);
  const xo = X(C.x0);
  mk(xo, PY1-3, 'x₀ = '+nf(C.x0,0), '#b5705f', 'middle', 0, -3);

  /* --- 公式条 + 实时函数值 --- */
  const fv = C.f(xNow), gv = C.g(xNow), dfv = C.df(xNow), dgv = C.dg(xNow);
  tex(document.getElementById('stripTex'),
      `\\lim_{x\\to ${nf(C.x0,0)}}\\dfrac{${C.fT}}{${C.gT}} \\;=\\; ` +
      `\\lim_{x\\to ${nf(C.x0,0)}}\\dfrac{${C.dfT}}{${C.dgT}} \\;=\\; ${nf(C.lim,0)}`,
      `lim(x→${nf(C.x0,0)}) f/g = lim f'/g' = ${nf(C.lim,0)}`);
  document.getElementById('stripVal').textContent =
    `x = ${nf(xNow,2)}(${dir > 0 ? '右' : '左'})  f=${nf(fv,4)}  g=${nf(gv,4)}  f′=${nf(dfv,4)}  g′=${nf(dgv,4)}`;

  /* --- 数值面板 --- */
  document.getElementById('vd').textContent = nf(d,2);
  document.getElementById('rx').textContent = nf(xNow,2);
  document.getElementById('rR').textContent = nf(vR,6);
  document.getElementById('rD').textContent = nf(vD,6);
  document.getElementById('rE').textContent = nf(Math.abs(vR - vD),6);

  /* --- 一句话本质 --- */
  const dd = Math.abs(vR - vD);
  const side = dir > 0 ? '右' : '左';
  const closing = d <= 0.03 ? ' 现在两个比值已经几乎重合。' : ' 继续把 δ 拖小，看它们贴合。';
  document.getElementById('concl').innerHTML =
    `从${side}侧取 x = <b>${nf(xNow,2)}</b>（δ = <b>${nf(d,2)}</b>）：f/g = <b>${nf(vR,6)}</b>，` +
    `f′/g′ = <b>${nf(vD,6)}</b>，相差 <b>${nf(dd,6)}</b>，两者同时趋近 <b>${nf(C.lim,0)}</b>。` +
    `<br><span class="tag">一句话本质：</span>` +
    `f/g 在 x₀ 处是 0/0 型不定式时，原比值与导数比值同趋一值——算不出 f/g，就算 f′/g′。${closing}`;
}

/* ================= 交互 ================= */
document.getElementById('sd').addEventListener('input', render);
document.getElementById('bdir').addEventListener('click', () => {
  dir = -dir;
  document.getElementById('bdir').textContent = dir > 0 ? '从右侧趋近 ▸' : '从左侧趋近 ◂';
  render();
});
function pick(k){
  cur = k; C = CASES[k];
  document.getElementById('ba').classList.toggle('on', k === 'a');
  document.getElementById('bb').classList.toggle('on', k === 'b');
  document.getElementById('sub').textContent = C.sub;
  render();
}
document.getElementById('ba').addEventListener('click', () => pick('a'));
document.getElementById('bb').addEventListener('click', () => pick('b'));
render();
</script>
</body>
</html>
