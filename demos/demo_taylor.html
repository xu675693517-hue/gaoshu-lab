<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>泰勒展开 · 多项式逼近 f(x)</title>
<link rel="stylesheet" href="../assets/katex/katex.min.css">
<script src="../assets/katex/katex.min.js"></script>
<style>
:root{
  --page:#f7f4ef; --surface:#ffffff; --ink:#2a2f2e; --muted:#8a908e;
  --line:#e5dfd6; --sage:#6e8b7b; --sage-deep:#4e6a5b; --blue:#6b8899;
  --sand:#b39a6e; --rose:#b5705f; --mauve:#93899c;
}
*{box-sizing:border-box}
html{overflow-x:hidden}
body{margin:0;padding:0;background:var(--page);color:var(--ink);
  font-family:"Segoe UI","Microsoft YaHei",sans-serif;overflow-x:hidden;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:12px 16px 10px;box-shadow:0 1px 3px rgba(47,53,55,.05)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:16.5px;font-weight:600;letter-spacing:.2px}
h1 small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.btns{display:flex;gap:6px}
button{font-family:inherit;font-size:12.5px;color:var(--ink);background:#f1eee8;
  border:1px solid var(--line);border-radius:8px;padding:4px 11px;cursor:pointer}
button:hover{background:#eae5dc}
button.on{background:var(--sage-deep);border-color:var(--sage-deep);color:#fbfbf8}
.strip{min-height:40px;display:flex;align-items:center;gap:10px;overflow:hidden;
  margin:4px 0 2px;padding:2px 0;font-size:14px;flex-wrap:nowrap}
.strip .lbl{font-size:12px;color:var(--muted);white-space:nowrap;flex:0 0 auto}
#pTex{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.fb{font-family:Consolas,"Courier New",monospace;font-size:12.5px;color:var(--ink)}
#plot{display:block;width:100%;height:auto;background:#fffdfa;border:1px solid var(--line);
  border-radius:10px}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 6px}
.slot{display:flex;align-items:center;gap:8px;flex:1 1 250px;min-width:210px}
.slot label{font-size:12.5px;color:var(--muted);white-space:nowrap}
input[type=range]{flex:1 1 auto;min-width:90px;height:20px;accent-color:var(--sage-deep);
  background:transparent;cursor:pointer}
.val{font-family:Consolas,"Courier New",monospace;font-size:12.5px;color:var(--sage-deep);
  min-width:52px;text-align:right}
.read{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 7px}
.read b{font-family:Consolas,"Courier New",monospace;color:var(--ink);font-weight:600}
.concl{border-left:3px solid var(--sage-deep);background:#eaece7;border-radius:0 8px 8px 0;
  padding:8px 12px;font-size:13px;line-height:1.5}
.concl b{font-family:Consolas,"Courier New",monospace;color:var(--sage-deep)}
.concl .f{font-family:Consolas,"Courier New",monospace}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:2px 0 0}
.legend i{display:inline-block;width:16px;height:0;border-top-width:2.5px;border-top-style:solid;
  vertical-align:middle;margin-right:4px}
svg text{font-family:"Segoe UI","Microsoft YaHei",sans-serif}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="head">
    <h1>泰勒展开 · 多项式逼近 f(x)<small id="sub">f(x)=sin x，在 x=0 处展开</small></h1>
    <div class="btns">
      <button id="bSin" class="on">sin x</button>
      <button id="bExp">eˣ</button>
      <button id="bLn">ln(1+x)</button>
    </div>
  </div>

  <div class="strip">
    <span class="lbl">当前多项式</span>
    <span id="pTex"></span>
  </div>

  <svg id="plot" viewBox="0 0 860 218" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="泰勒多项式逼近函数图像的示意图">
    <defs><clipPath id="clip"><rect id="clipR" x="0" y="0" width="860" height="218"></rect></clipPath></defs>
    <g id="gGrid"></g>
    <g id="gAxes"></g>
    <g id="gTicks"></g>
    <g clip-path="url(#clip)">
      <path id="pPoly" fill="none" stroke="#b5705f" stroke-width="2.4" stroke-linejoin="round"></path>
      <path id="pCurve" fill="none" stroke="#6e8b7b" stroke-width="2.4" stroke-linejoin="round"></path>
      <line id="lV" stroke="#b39a6e" stroke-width="1.2" stroke-dasharray="3 3"></line>
      <circle id="dotF" r="4.6" fill="#4e6a5b" stroke="#fffdfa" stroke-width="1.6"></circle>
      <circle id="dotP" r="4.6" fill="#b5705f" stroke="#fffdfa" stroke-width="1.6"></circle>
      <line id="errBar" stroke="#93899c" stroke-width="2" stroke-dasharray="4 3"></line>
    </g>
    <g id="gLabels"></g>
  </svg>

  <div class="legend">
    <span><i style="border-top-color:#6e8b7b"></i>f(x)（真值）</span>
    <span><i style="border-top-color:#b5705f"></i>Pₙ(x)（n 阶麦克劳林多项式）</span>
    <span><i style="border-top-color:#93899c;border-top-style:dashed"></i>该点误差 |f−Pₙ|</span>
    <span><i style="border-top-color:#b39a6e;border-top-style:dashed"></i>考察点 x₀</span>
  </div>

  <div class="ctrl">
    <div class="slot">
      <label for="sn">阶数 n =</label>
      <input id="sn" type="range" min="0" max="10" step="1" value="6">
      <span class="val" id="vn">6</span>
    </div>
    <div class="slot">
      <label for="sx">考察点 x₀ =</label>
      <input id="sx" type="range" min="-3.142" max="3.142" step="0.001" value="1">
      <span class="val" id="vx">1.000</span>
    </div>
  </div>

  <div class="read">
    <span>Pₙ(x₀) = <b id="rp">—</b></span>
    <span>f(x₀) = <b id="rf">—</b></span>
    <span>该点误差 = <b id="re">—</b></span>
    <span>区间内最大误差 = <b id="rmax">—</b></span>
    <span>项数 = <b id="rterm">—</b></span>
  </div>

  <div class="concl" id="concl">—</div>
</div></div>

<script>
/* ---------- 工具 ---------- */
function tex(el, s, fb){
  try{
    if(typeof katex === 'undefined' || typeof katex.renderToString !== 'function')
      throw new Error('katex unavailable');
    el.innerHTML = katex.renderToString(s, {throwOnError:false, displayMode:false});
  }catch(e){ el.className = 'fb'; el.textContent = fb; }
}
function niceTicks(lo, hi, n){
  const span = hi - lo;
  if(!(span > 0) || !isFinite(span)) return [lo];
  const raw = span/n, mag = Math.pow(10, Math.floor(Math.log10(raw))), nm = raw/mag;
  let st = nm <= 1 ? 1 : nm <= 2 ? 2 : nm <= 2.5 ? 2.5 : nm <= 5 ? 5 : 10;
  st *= mag;
  const out = [];
  for(let v = Math.ceil(lo/st)*st; v <= hi + 1e-9; v += st) out.push(+(v.toFixed(10)));
  return out;
}
function nf(v, d){ if(!isFinite(v)) return '—'; if(Math.abs(v) < 5e-13) v = 0; return v.toFixed(d); }
function errFmt(v){
  if(!isFinite(v)) return '—';
  if(v === 0) return '0';
  if(v >= 1e-3) return v.toPrecision(3);
  const e = Math.floor(Math.log10(v));
  const man = v / Math.pow(10, e);
  return man.toFixed(2) + '×10' + String(e).replace(/-/g,'⁻').replace(/[0-9]/g, c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]);
}
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
const FACT = [1,1,2,6,24,120,720,5040,40320,362880,3628800];

/* ---------- 三个函数：真值 + 麦克劳林系数 ---------- */
const PI = Math.PI;
const CFG = {
  sin: {label:'f(x)=sin x', domain:[-PI, PI], yWin:[-2.0, 2.0], slide:[-3.142, 3.142, 0.001],
        f:x=>Math.sin(x),
        coef:k=>(k % 2 === 1 ? (((k-1)/2) % 2 === 0 ? 1 : -1)/FACT[k] : 0),
        plain:k=>k===1 ? 'x' : (k%2===1 ? ((k-1)/2%2===0?' + ':' − ') + 'x^'+k+'/'+k+'!' : ''),
        div:k=>k+'!', note:'sin 只有奇次项：偶数阶不会改变 Pₙ。'},
  exp: {label:'f(x)=eˣ', domain:[-2, 2], yWin:[-0.6, 8.2], slide:[-2, 2, 0.001],
        f:x=>Math.exp(x),
        coef:k=>1/FACT[k],
        plain:k=>k===0 ? '1' : (k===1 ? ' + x' : ' + x^'+k+'/'+k+'!'),
        div:k=>k+'!', note:'eˣ 的每阶都贡献新项，误差逐阶下降。'},
  ln:  {label:'f(x)=ln(1+x)', domain:[-0.88, 1.05], yWin:[-3.0, 2.0], slide:[-0.88, 1.05, 0.001],
        f:x=>Math.log(1+x),
        coef:k=>k===0 ? 0 : (k % 2 === 1 ? 1 : -1)/k,
        plain:k=>k===1 ? 'x' : (k%2===1 ? ' + x^'+k+'/'+k : ' − x^'+k+'/'+k),
        div:k=>String(k), note:'收敛半径只有 1：区间右端 x→1 时逼近变慢，且需 n 足够大。'}
};
let key = 'sin';
let cfg = CFG[key];

function polyVal(n, x){
  let s = 0;
  for(let k = n; k >= 0; k--) s = s*x + cfg.coef(k);
  return s;
}
function texFormula(n){
  let s = '';
  let first = true;
  for(let k = 0; k <= n; k++){
    const c = cfg.coef(k);
    if(c === 0) continue;
    const body = k === 0 ? '1' : (k === 1 ? 'x' : `\\dfrac{x^{${k}}}{${cfg.div(k)}}`);
    s += (first ? (c < 0 ? '-' : '') : (c > 0 ? '+' : '-')) + body;
    first = false;
  }
  return `P_{${n}}(x)=` + (s || '0');
}
function plainFormula(n){
  let s = '';
  for(let k = 0; k <= n; k++){ if(cfg.coef(k) !== 0) s += cfg.plain(k); }
  return 'P' + n + '(x) = ' + (s || '0');
}

/* ---------- 画布 ---------- */
const W = 860, H = 218, ML = 50, MR = 18, MT = 12, MB = 32;
const PX0 = ML, PX1 = W - MR, PY0 = MT, PY1 = H - MB;

function render(){
  const n = +document.getElementById('sn').value;
  const x0 = +document.getElementById('sx').value;
  const xMin = cfg.domain[0], xMax = cfg.domain[1];
  const yMin = cfg.yWin[0], yMax = cfg.yWin[1];
  const X = x => PX0 + (x-xMin)/(xMax-xMin)*(PX1-PX0);
  const Y = y => PY1 - (y-yMin)/(yMax-yMin)*(PY1-PY0);

  /* 网格 / 轴 */
  const gGrid = document.getElementById('gGrid'), gAxes = document.getElementById('gAxes'),
        gTicks = document.getElementById('gTicks');
  gGrid.innerHTML=''; gAxes.innerHTML=''; gTicks.innerHTML='';
  const xt = niceTicks(xMin, xMax, 6), yt = niceTicks(yMin, yMax, 5);
  const lbl = v => Math.abs(v-Math.PI) < 1e-6 ? 'π' : (Math.abs(v+Math.PI) < 1e-6 ? '−π'
            : (Math.abs(v-Math.PI/2) < 1e-6 ? 'π/2' : (Math.abs(v+Math.PI/2) < 1e-6 ? '−π/2' : nf(v, 1))));
  xt.forEach(v => gGrid.appendChild(el('line', {x1:X(v),y1:PY0,x2:X(v),y2:PY1,stroke:'#ece7de','stroke-width':1})));
  yt.forEach(v => gGrid.appendChild(el('line', {x1:PX0,y1:Y(v),x2:PX1,y2:Y(v),stroke:'#ece7de','stroke-width':1})));
  gAxes.appendChild(el('line', {x1:PX0,y1:Y(0),x2:PX1,y2:Y(0),stroke:'#c8c0b4','stroke-width':1.3}));
  if(xMin < 0 && xMax > 0)
    gAxes.appendChild(el('line', {x1:X(0),y1:PY0,x2:X(0),y2:PY1,stroke:'#c8c0b4','stroke-width':1.3}));
  xt.forEach(v => { const t = el('text', {x:X(v), y:PY1+14, 'font-size':10.5, fill:'#8a908e','text-anchor':'middle'});
    t.textContent = lbl(v); gTicks.appendChild(t); });
  yt.forEach(v => { const t = el('text', {x:PX0-6, y:Y(v)+3.5, 'font-size':10.5, fill:'#8a908e','text-anchor':'end'});
    t.textContent = nf(v, Math.abs(v) < 10 && Math.abs(v%1) > 1e-9 ? 1 : 0); gTicks.appendChild(t); });

  /* 两条曲线 */
  const N = 700;
  let dc = '', dpp = '';
  for(let i = 0; i <= N; i++){
    const x = xMin + (xMax-xMin)*i/N;
    const yf = cfg.f(x);
    if(isFinite(yf)) dc += (dc ? ' L ' : 'M ') + X(x).toFixed(2) + ' ' + Y(yf).toFixed(2);
    const yp = polyVal(n, x);
    if(isFinite(yp)) dpp += (dpp ? ' L ' : 'M ') + X(x).toFixed(2) + ' ' + Y(yp).toFixed(2);
  }
  document.getElementById('pCurve').setAttribute('d', dc);
  document.getElementById('pPoly').setAttribute('d', dpp);

  /* 考察点 */
  const fp = cfg.f(x0), pp = polyVal(n, x0), err = Math.abs(fp - pp);
  const lV = document.getElementById('lV');
  lV.setAttribute('x1', X(x0)); lV.setAttribute('x2', X(x0));
  lV.setAttribute('y1', PY0);   lV.setAttribute('y2', PY1);
  const dotF = document.getElementById('dotF'), dotP = document.getElementById('dotP');
  dotF.setAttribute('cx', X(x0)); dotF.setAttribute('cy', Y(fp));
  dotP.setAttribute('cx', X(x0)); dotP.setAttribute('cy', Y(pp));
  const eb = document.getElementById('errBar');
  eb.setAttribute('x1', X(x0) + 13); eb.setAttribute('x2', X(x0) + 13);
  eb.setAttribute('y1', Y(fp));      eb.setAttribute('y2', Y(pp));

  /* 标签 */
  const gL = document.getElementById('gLabels'); gL.innerHTML='';
  const mk = (x, y, s, fill, anchor, dx=0, dy=0) => {
    const t = el('text', {x:x+dx, y:y+dy, 'font-size':11.5, fill:fill, 'text-anchor':anchor||'start',
      'font-weight':500});
    t.textContent = s; gL.appendChild(t);
  };
  mk(X(x0), Y(fp), 'f('+nf(x0,3)+')='+nf(fp,5), '#4e6a5b', 'middle', 0, -11);
  mk(X(x0)+18, (Y(fp)+Y(pp))/2, '误差 '+errFmt(err), '#93899c', 'start', 0, 4);
  mk(X(0), Y(0), 'O', '#8a908e', 'end', -5, 13);

  /* 区间最大误差（数值扫描） */
  let mx = 0, mxAt = xMin;
  for(let i = 0; i <= 1200; i++){
    const x = xMin + (xMax-xMin)*i/1200;
    const e = Math.abs(cfg.f(x) - polyVal(n, x));
    if(isFinite(e) && e > mx){ mx = e; mxAt = x; }
  }

  /* 项数 */
  let terms = 0; for(let k = 0; k <= n; k++) if(cfg.coef(k) !== 0) terms++;
  document.getElementById('pTex').style.fontSize = terms <= 4 ? '14px' : (terms <= 7 ? '12.5px' : '11.5px');
  tex(document.getElementById('pTex'), texFormula(n), plainFormula(n));

  document.getElementById('vn').textContent = n;
  document.getElementById('vx').textContent = nf(x0, 3);
  document.getElementById('rp').textContent = nf(pp, 8);
  document.getElementById('rf').textContent = nf(fp, 8);
  document.getElementById('re').textContent = errFmt(err);
  document.getElementById('rmax').textContent = errFmt(mx) + '（x≈' + nf(mxAt, 2) + '）';
  document.getElementById('rterm').textContent = terms;

  /* 结论条 */
  document.getElementById('concl').innerHTML =
    `n = <b>${n}</b>：<span class="f">${plainFormula(n)}</span>。在 x₀ = <b>${nf(x0,3)}</b> 处 ` +
    `Pₙ = <b>${nf(pp,8)}</b>，f(x₀) = <b>${nf(fp,8)}</b>，误差 <b>${errFmt(err)}</b>；` +
    `区间内最大误差 <b>${errFmt(mx)}</b>（x≈${nf(mxAt,2)}）。` +
    `n 增大时 Pₙ 在展开点 x=0 附近越来越贴合 f(x)：${cfg.note}`;

  document.getElementById('sub').textContent = cfg.label + '，在 x=0 处展开';
}

/* ---------- 交互 ---------- */
document.getElementById('sn').addEventListener('input', render);
document.getElementById('sx').addEventListener('input', render);
function setFn(k){
  key = k; cfg = CFG[k];
  const sx = document.getElementById('sx');
  sx.min = cfg.slide[0]; sx.max = cfg.slide[1]; sx.step = cfg.slide[2];
  sx.value = 1;   /* x₀ = 1 正好落在步长格点上，保证数值可核对 */
  ['bSin','bExp','bLn'].forEach(id => document.getElementById(id).classList.remove('on'));
  document.getElementById({sin:'bSin', exp:'bExp', ln:'bLn'}[k]).classList.add('on');
  render();
}
document.getElementById('bSin').addEventListener('click', () => setFn('sin'));
document.getElementById('bExp').addEventListener('click', () => setFn('exp'));
document.getElementById('bLn').addEventListener('click', () => setFn('ln'));
setFn('sin');
</script>
</body>
</html>
