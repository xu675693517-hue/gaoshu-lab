<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分部积分法 · ∫u dv = uv − ∫v du 的项对应</title>
<link rel="stylesheet" href="../assets/katex/katex.min.css">
<style>
:root{--bg:#f7f4ef;--surface:#ffffff;--ink:#2a2f2e;--ink2:#535a59;--muted:#8a908e;--line:#e5dfd6;--p:#6e8b7b;--p-deep:#4e6a5b;--p-soft:#e8efeb;--ok:#5c8a6a;--warn:#bf8a3c;--bad:#b5705f;--info:#6b8899}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:13.5px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:6px 14px 6px}
h1{font-size:15.5px;line-height:1.3;margin:0 0 2px;font-weight:600;letter-spacing:.2px}
.sub{font-size:12.2px;line-height:1.4;color:var(--ink2);margin:0 0 4px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px;margin-bottom:5px}
.bar .lb{font-size:12px;color:var(--muted);white-space:nowrap}
select{font:inherit;font-size:12.4px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
input[type=range]{-webkit-appearance:none;appearance:none;height:20px;background:transparent;flex:1;min-width:130px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;background:var(--line);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-5px;border-radius:50%;background:var(--p-deep);border:2px solid var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.18)}
input[type=range]::-moz-range-track{height:5px;background:var(--line);border-radius:3px}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:2px solid var(--surface);border-radius:50%;background:var(--p-deep)}
.val{font-variant-numeric:tabular-nums;font-weight:600;color:var(--p-deep);min-width:3.2em;display:inline-block;font-size:12.6px}
canvas{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.st{flex:1;min-width:126px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.st .k{font-size:10.8px;color:var(--muted);line-height:1.3}
.st .v{font-size:14px;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.st .tex{font-size:11.5px;line-height:1.15;overflow:hidden}
.concl{margin-top:6px;background:var(--p-soft);border:1px solid var(--line);border-left:3px solid var(--p-deep);border-radius:8px;padding:5px 9px;font-size:12.2px}
.concl b{color:var(--p-deep)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.info{color:var(--info)}
@media (max-width:560px){.st{min-width:45%}}
</style>
</head>
<body>
<div class="wrap">
  <h1>分部积分法 · 看 ∫u dv = uv − ∫v du 的每一项</h1>
  <p class="sub" id="setup">—</p>

  <div class="bar">
    <span class="lb">选择题目</span>
    <select id="mode">
      <option value="xe">∫ x·eˣ dx（u = x，dv = eˣdx）</option>
      <option value="xln">∫ x·ln x dx（u = ln x，dv = x dx）</option>
    </select>
    <span class="lb">积分上界 b =</span><span class="val" id="bv">—</span>
    <input type="range" id="bsl" min="0.2" max="3" step="0.01" value="1">
    <span class="lb">拖动分界 b</span>
  </div>

  <canvas id="main" style="height:208px"></canvas>

  <div class="stats">
    <div class="st"><div class="k">左边 ∫u dv（数值积分）</div><div class="v" id="vL">—</div>
      <div class="tex" id="tL"></div></div>
    <div class="st"><div class="k">边界项 uv（整体积出）</div><div class="v info" id="vUV">—</div>
      <div class="tex" id="tUV"></div></div>
    <div class="st"><div class="k">右边要减的 ∫v du</div><div class="v warn" id="vR">—</div>
      <div class="tex" id="tR"></div></div>
    <div class="st"><div class="k">验证 uv − ∫v du 与左边的差</div><div class="v ok" id="vD">—</div>
      <div class="k">恒等式成立则差 ≈ 0</div></div>
  </div>

  <div class="concl"><b>一句话本质：</b>分部积分就是乘积求导公式 <span class="tex" data-tex="(uv)'=u'v+uv'"></span> 的"积分版"——把难积的 <span class="tex" data-tex="\int u\,dv"></span> 换成<b>一个边界项 uv 减去一个好积的 ∫v du</b>；选谁当 u 用口诀"反·对·幂·指·三"，靠前的优先当 u。</div>
</div>

<script src="../assets/katex/katex.min.js"></script>
<script>
(function(){
"use strict";
var C={ink:'#2a2f2e',ink2:'#535a59',muted:'#8a908e',line:'#e5dfd6',p:'#6e8b7b',pDeep:'#4e6a5b',pSoft:'#e8efeb',ok:'#5c8a6a',warn:'#bf8a3c',bad:'#b5705f',info:'#6b8899'};
var $=function(s){return document.querySelector(s);};

function kt(el){
  if(!el) return;
  var s=el.getAttribute('data-tex'); if(s===null) return;
  try{
    if(window.katex && typeof katex.renderToString==='function'){
      el.innerHTML=katex.renderToString(s,{displayMode:el.hasAttribute('data-display'),throwOnError:false,strict:false});
      return;
    }
  }catch(e){}
  el.textContent=s.replace(/\\[a-zA-Z]+/g,' ').replace(/[{}]/g,'').replace(/\s+/g,' ').trim();
}
function renderTex(root){var n=(root||document).querySelectorAll('.tex');for(var i=0;i<n.length;i++) kt(n[i]);}
function setTex(el,s){if(!el)return;el.setAttribute('data-tex',s);kt(el);}
var SUP={'-':'\u207B','0':'\u2070','1':'\u00B9','2':'\u00B2','3':'\u00B3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079'};
function sup(n){return String(n).split('').map(function(c){return SUP[c]||c;}).join('');}
function fmtErr(v){
  if(!isFinite(v)) return '—';
  if(v===0) return '0';
  var e=Math.floor(Math.log10(Math.abs(v))),m=v/Math.pow(10,e);
  if(e>=-1&&e<=0) return v.toFixed(4);
  return m.toFixed(2)+'\u00D710'+sup(e);
}
function num(v,d){ d=(d===undefined?4:d); return (Math.abs(v)>=1000||(Math.abs(v)<1e-3&&v!==0))?v.toExponential(3):v.toFixed(d); }
function simpson(f,a,b,n){
  if(n%2) n++;
  var h=(b-a)/n,s=f(a)+f(b),i;
  for(i=1;i<n;i++) s+=(i%2?4:2)*f(a+i*h);
  return s*h/3;
}
function fit(cv){
  var dpr=Math.max(1,window.devicePixelRatio||1);
  var w=cv.clientWidth||600,h=cv.clientHeight||200;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  var ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  return {ctx:ctx,w:w,h:h};
}

/* ---------- 两种素材：闭式（uv、∫v du） + 被积函数（数值积分） ---------- */
var MODES={
  xe:{
    f:function(x){return x*Math.exp(x);},
    x0:0,x1:3,
    u:'x', dv:'e^{x}\\,dx', v:'e^{x}', du:'dx',
    title:'阴影 = \u222Bu dv = \u222B\u2080^b x\u00B7e\u02E3 dx',
    setup:'被积函数是"幂 \u00D7 指数"，按口诀取 u = x（幂）、dv = e\u02E3dx（指）：则 du = dx，v = e\u02E3，'
        +'于是 &nbsp;<span class="tex" data-tex="\\int_0^b x e^{x}dx=\\Big[x e^{x}\\Big]_0^b-\\int_0^b e^{x}dx"></span>。',
    uv:function(b){return b*Math.exp(b);},
    vdu:function(b){return Math.exp(b)-1;},
    iTex:function(b){return '\\int_{0}^{'+b.toFixed(2)+'} u\\,dv = \\int_{0}^{'+b.toFixed(2)+'} x e^{x}dx';},
    uvTex:function(b){return 'uv=\\Big[x e^{x}\\Big]_0^{'+b.toFixed(2)+'}='+num(b*Math.exp(b),4);},
    rTex:function(b){return '\\int v\\,du=\\int_{0}^{'+b.toFixed(2)+'} e^{x}dx='+num(Math.exp(b)-1,4);}
  },
  xln:{
    f:function(x){return x*Math.log(x);},
    x0:1,x1:3,
    u:'\\ln x', dv:'x\\,dx', v:'\\dfrac{x^{2}}{2}', du:'\\dfrac{dx}{x}',
    title:'阴影 = \u222Bu dv = \u222B\u2081^b x\u00B7ln x dx',
    setup:'被积函数是"幂 \u00D7 对数"，按口诀取 u = ln x（对）、dv = x dx（幂）：则 du = dx/x，v = x\u00B2/2，'
        +'于是 &nbsp;<span class="tex" data-tex="\\int_1^b x\\ln x\\,dx=\\Big[\\dfrac{x^{2}}{2}\\ln x\\Big]_1^b-\\int_1^b\\dfrac{x}{2}dx"></span>。',
    uv:function(b){return b*b/2*Math.log(b);},
    vdu:function(b){return (b*b-1)/4;},
    iTex:function(b){return '\\int_{'+b.toFixed(2)+'}^{'+b.toFixed(2)+'} u\\,dv = \\int_{1}^{'+b.toFixed(2)+'} x\\ln x\\,dx';},
    uvTex:function(b){return 'uv=\\Big[\\dfrac{x^{2}}{2}\\ln x\\Big]_1^{'+b.toFixed(2)+'}='+num(b*b/2*Math.log(b),4);},
    rTex:function(b){return '\\int v\\,du=\\int_{1}^{'+b.toFixed(2)+'}\\dfrac{x}{2}dx='+num((b*b-1)/4,4);}
  }
};
var cur='xe';

/* ---------- 面板 A：曲线 + 阴影面积 ---------- */
function drawCurve(ctx,px,py,pw,ph,M,b){
  var padL=32,padR=18,padT=20,padB=18;
  var x0=M.x0,x1=M.x1,yMax=M.f(x1)*1.08+1e-9;
  var X=function(v){return px+padL+(v-x0)/(x1-x0)*(pw-padL-padR);};
  var Y=function(v){return py+ph-padB-Math.min(v,yMax)/yMax*(ph-padT-padB);};
  var y0=Y(0),i,v,N=240;
  ctx.font='11.5px "Segoe UI","Microsoft YaHei",sans-serif';
  ctx.fillStyle=C.ink2;ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillText(M.title,px+padL-18,py+12);
  /* 轴 */
  ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.beginPath();
  ctx.moveTo(X(x0),y0);ctx.lineTo(px+pw-padR+8,y0);ctx.stroke();
  /* 阴影 [x0,b] */
  ctx.beginPath();ctx.moveTo(X(x0),y0);
  for(i=0;i<=N;i++){v=x0+(b-x0)*i/N;ctx.lineTo(X(v),Y(M.f(v)));}
  ctx.lineTo(X(b),y0);ctx.closePath();
  ctx.fillStyle=C.pSoft;ctx.fill();
  /* 曲线 */
  ctx.beginPath();
  for(i=0;i<=N;i++){v=x0+(x1-x0)*i/N;ctx.lineTo(X(v),Y(M.f(v)));}
  ctx.strokeStyle=C.p;ctx.lineWidth=1.8;ctx.stroke();
  /* 轴上的 b 分界 */
  ctx.strokeStyle=C.pDeep;ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(X(x0),y0);ctx.lineTo(X(b),y0);ctx.stroke();
  ctx.lineWidth=1;ctx.lineCap='butt';
  ctx.setLineDash([3,3]);ctx.strokeStyle=C.pDeep;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(X(b),y0);ctx.lineTo(X(b),Y(M.f(b)));ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();ctx.arc(X(b),Y(M.f(b)),3.4,0,Math.PI*2);
  ctx.fillStyle=C.p;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.4;ctx.stroke();
  /* 刻度：b 位置 */
  ctx.fillStyle=C.muted;ctx.font='10.5px "Segoe UI","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='top';
  ctx.strokeStyle=C.line;ctx.beginPath();ctx.moveTo(X(b),y0);ctx.lineTo(X(b),y0+4);ctx.stroke();
  ctx.fillText('b = '+b.toFixed(2),X(b),y0+6);
  ctx.textAlign='left';
  var lab='\u222Bu dv = '+num(numOf(M,b),4);
  if(X(b)+8>px+pw-96){ ctx.textAlign='right'; ctx.fillStyle=C.pDeep;
    ctx.font='600 11.5px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillText(lab,X(b)-8,py+14); }
  else { ctx.fillStyle=C.pDeep;
    ctx.font='600 11.5px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillText(lab,X(b)+8,py+ph/2); }
}
function numOf(M,b){ return simpson(M.f,M.x0,b,4000); }

/* ---------- 面板 B：三项柱状对比 ---------- */
function drawBars(ctx,px,py,pw,ph,M,b){
  var padL=34,padR=14,padT=30,padB=32;
  var uv=M.uv(b),vdu=M.vdu(b),udv=simpson(M.f,M.x0,b,4000);
  var mx=Math.max(uv,vdu,udv,1e-9);
  var base=py+ph-padB,plotH=ph-padT-padB;
  ctx.font='11px "Segoe UI","Microsoft YaHei",sans-serif';
  ctx.fillStyle=C.muted;ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillText('三项数值对比（同一高度尺）：边界项 uv = \u222Bv du + \u222Bu dv',px+padL-18,py+11);
  var items=[
    {v:uv, c:C.info, t:'uv', s:'边界项'},
    {v:vdu,c:C.warn, t:'\u222Bv du',s:'要减掉的'},
    {v:udv,c:C.p,    t:'\u222Bu dv',s:'要求的'}
  ];
  var n=items.length, innerW=pw-padL-padR, slot=innerW/n, bw=Math.min(74,slot*0.56);
  ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.beginPath();
  ctx.moveTo(px+padL-10,base);ctx.lineTo(px+pw-padR,base);ctx.stroke();
  for(var i=0;i<n;i++){
    var cx=px+padL+slot*(i+0.5),hgt=Math.max(1,items[i].v/mx*plotH);
    ctx.fillStyle=items[i].c;
    ctx.beginPath();
    ctx.rect(cx-bw/2,base-hgt,bw,hgt);
    ctx.fill();
    ctx.font='600 11.5px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillStyle=items[i].c;ctx.textAlign='center';
    ctx.fillText(num(items[i].v,3),cx,base-hgt-5);
    ctx.fillStyle=C.ink2;ctx.font='11px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillText(items[i].t,cx,base+7);
    ctx.fillStyle=C.muted;ctx.font='10.2px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillText(items[i].s,cx,base+17);
  }
  ctx.textAlign='left';
}

/* ---------- 主渲染 ---------- */
function render(){
  var M=MODES[cur];
  var b=parseFloat($('#bsl').value);
  if(cur==='xln'&&b<1){ b=1; }
  $('#bv').textContent=b.toFixed(2);

  var uv=M.uv(b),vdu=M.vdu(b),udv=simpson(M.f,M.x0,b,4000);
  var d=Math.abs(udv-(uv-vdu));
  $('#vL').textContent=num(udv,6);
  $('#vUV').textContent=num(uv,6);
  $('#vR').textContent=num(vdu,6);
  $('#vD').textContent=fmtErr(d);
  $('#vD').className='v '+(d<1e-6?'ok':'bad');
  setTex($('#tL'),'\\int_{'+M.x0+'}^{'+b.toFixed(2)+'} '+M.ftex+'\\,dx');
  setTex($('#tUV'),M.uvTex(b));
  setTex($('#tR'),M.rTex(b));

  var g=fit($('#main')),ctx=g.ctx,w=g.w,h=g.h;
  var phA=110,phB=h-phA-8;
  drawCurve(ctx,4,0,w-8,phA,M,b);
  drawBars(ctx,4,phA+8,w-8,phB,M,b);
}

/* ---------- 模式切换 ---------- */
function setMode(m){
  cur=m;
  var s=$('#bsl');
  if(m==='xln'){ s.min=1; s.max=3; s.step=0.01; s.value=2.72; }
  else{ s.min=0.2; s.max=3; s.step=0.01; s.value=1; }
  $('#setup').innerHTML=MODES[m].setup;
  renderTex($('#setup'));
  render();
}
$('#mode').addEventListener('change',function(){setMode(this.value);});
$('#bsl').addEventListener('input',render);
window.addEventListener('resize',render);
window.addEventListener('load',render);

/* 给两个模式补上被积函数 tex 与渲染所需字段 */
MODES.xe.ftex='x e^{x}';
MODES.xln.ftex='x\\ln x';
renderTex(document);
setMode('xe');
})();
</script>
</body>
</html>
